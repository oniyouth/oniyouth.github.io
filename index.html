<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>OniYouth - Streetwear</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    <meta name="description" content="OniYouth - Streetwear Culture. Envio a todo el Peru.">
    <meta name="theme-color" content="#000000">

    <!-- Open Graph / compartir en redes (WhatsApp, Instagram, Facebook, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="OniYouth">
    <meta property="og:title" content="OniYouth — Streetwear">
    <meta property="og:description" content="Streetwear culture. Envio a todo el Peru.">
    <meta property="og:url" content="https://oniyouth.xyz/">
    <meta property="og:image" content="https://oniyouth.xyz/assets/images/hero-bg.jpg">
    <meta property="og:image:alt" content="OniYouth Streetwear">
    <meta property="og:locale" content="es_PE">
    <!-- Twitter / X Card -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="OniYouth — Streetwear">
    <meta name="twitter:description" content="Streetwear culture. Envio a todo el Peru.">
    <meta name="twitter:image" content="https://oniyouth.xyz/assets/images/hero-bg.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- SDK de Mercado Pago (Checkout Pro, Fase 7b). La Public Key es publica. -->
    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #000; --bg2: #0a0a0a; --bg-card: #111;
            --text: #fff; --text2: #888; --text3: #555;
            --border: #222; --accent: #fff;
            --logo-filter: brightness(0) invert(1);
            --nav-bg: rgba(0,0,0,0.85);
        }

        [data-theme="light"] {
            --bg: #fff; --bg2: #f5f5f5; --bg-card: #f0f0f0;
            --text: #000; --text2: #666; --text3: #aaa;
            --border: #e0e0e0; --accent: #000;
            --logo-filter: none;
            --nav-bg: rgba(255,255,255,0.9);
        }

        html { scroll-behavior: smooth; width: 100%; overflow-x: clip; }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            width: 100%;
            transition: background 0.5s, color 0.5s;
        }

        /* ===== NAV ===== */
        nav {
            position: absolute; top: 0; width: 100%; height: 50px;
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
            background: transparent;
            backdrop-filter: none; -webkit-backdrop-filter: none;
            border-bottom: none;
            transition: none;
            pointer-events: none;
        }
        .nav-logo { display: flex; align-items: center; justify-content: center; text-decoration: none; pointer-events: auto; }
        .nav-logo img { width: 36px; height: 36px; filter: var(--logo-filter); transition: filter 0.5s; }
        .nav-logo span { display: none; }
        .nav-right { display: none; }
        .audio-btn {
            width: 34px; height: 34px; border: 1px solid var(--border);
            background: transparent; color: var(--text3); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; padding: 0;
        }
        .audio-btn:hover { border-color: var(--text); color: var(--text); }
        .audio-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .audio-btn .icon-muted { display: block; }
        .audio-btn .icon-unmuted { display: none; }
        .audio-btn.on .icon-muted { display: none; }
        .audio-btn.on .icon-unmuted { display: block; }
        .theme-toggle {
            width: 42px; height: 22px; background: var(--border);
            border-radius: 11px; position: relative; cursor: pointer;
            border: none; transition: background 0.3s;
        }
        .theme-toggle::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 16px; height: 16px; background: var(--text);
            border-radius: 50%; transition: all 0.3s;
        }
        [data-theme="light"] .theme-toggle::after { transform: translateX(20px); }

        /* ===== CART BUTTON ===== */
        .cart-btn {
            position: fixed; top: 1rem; right: 1.5rem;
            width: auto; height: auto;
            background: none;
            backdrop-filter: none; -webkit-backdrop-filter: none;
            border: none;
            border-radius: 0;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 6020; transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 0;
        }
        .cart-btn:hover { transform: scale(1.1); }
        .cart-btn img { width: 34px; height: 34px; filter: none; pointer-events: none; }
        .cart-badge {
            position: absolute; top: -2px; right: -6px;
            min-width: 18px; height: 18px;
            background: #fff; color: #000;
            font: 700 0.6rem 'Syne', sans-serif;
            border-radius: 9px; display: flex; align-items: center; justify-content: center;
            padding: 0 4px; pointer-events: none;
            transform: scale(0); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cart-badge.show { transform: scale(1); }

        /* Cart in shop page */
        .shop-page .cart-btn { z-index: 7020; }

        /* Cart in product detail */
        .product-detail .cart-btn { z-index: 8020; }

        /* ===== CART PAGE (full-screen overlay — like shop) ===== */
        .cart-page {
            position: fixed; inset: 0; z-index: 9000;
            background: #000;
            visibility: hidden;
            opacity: 0;
            overflow-y: auto;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .cart-page.active { visibility: visible; opacity: 1; }

        .cart-page-logo {
            position: absolute; top: 0; width: 100%; height: 50px;
            display: flex; justify-content: center; align-items: center;
            z-index: 9020; pointer-events: auto;
        }
        .cart-page-logo img { width: 36px; height: 36px; filter: brightness(0) invert(1); cursor: pointer; transition: filter 0.5s, transform 0.3s; }
        .cart-page-logo img:hover { transform: scale(1.1); }

        .cart-page-content {
            padding: 5rem 3rem 3rem;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            margin-bottom: 3rem;
        }
        .cart-title {
            font: 800 clamp(2rem, 5vw, 3.5rem) 'Syne', sans-serif;
            color: #fff;
            letter-spacing: -1px;
        }
        .cart-subtitle {
            font: 400 0.65rem 'Syne', sans-serif;
            color: rgba(255,255,255,0.3); text-transform: uppercase;
            letter-spacing: 4px; margin-top: 0.5rem;
        }

        .cart-items {
            flex: 1;
        }
        .cart-empty {
            text-align: center; padding: 5rem 1rem;
            color: rgba(255,255,255,0.2);
            font: 400 0.8rem 'Syne', sans-serif;
            letter-spacing: 3px; text-transform: uppercase;
        }
        .cart-item {
            display: flex; gap: 1.5rem; padding: 1.5rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            align-items: center;
        }
        .cart-item-img {
            width: 90px; height: 112px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .cart-item-img img { width: 100%; height: 100%; object-fit: contain; }
        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-name {
            font: 700 1rem 'Syne', sans-serif; color: #fff;
        }
        .cart-item-meta {
            font: 400 0.7rem 'Syne', sans-serif;
            color: rgba(255,255,255,0.4); margin-top: 0.4rem;
            letter-spacing: 1px;
        }
        .cart-item-price {
            font: 700 1.1rem 'Syne', sans-serif; color: #fff;
            margin-top: 0.5rem;
        }
        .cart-item-remove {
            width: 32px; height: 32px; flex-shrink: 0;
            background: transparent; border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.3); font-size: 0.9rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all 0.2s;
            font-family: 'Syne', sans-serif;
        }
        .cart-item-remove:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.3); }

        .cart-footer {
            padding: 2rem 0 3rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin-top: 2rem;
        }
        .cart-total-row {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 1.5rem;
        }
        .cart-total-label {
            font: 600 0.7rem 'Syne', sans-serif;
            color: rgba(255,255,255,0.4); text-transform: uppercase;
            letter-spacing: 3px;
        }
        .cart-total-amount {
            font: 700 1.2rem 'Syne', sans-serif; color: #fff;
        }
        .cart-checkout-btn {
            width: 100%; padding: 18px;
            background: #fff; color: #000; border: none;
            font: 700 0.7rem 'Syne', sans-serif;
            text-transform: uppercase; letter-spacing: 3px;
            cursor: pointer; transition: all 0.3s;
        }
        .cart-checkout-btn:hover { background: rgba(255,255,255,0.85); }
        .cart-checkout-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Aviso de ajustes de stock al abrir la bolsa (Fase 4) */
        .cart-notice {
            display: none; margin: 0 0 1.2rem; padding: 12px 14px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.04);
            font: 400 0.7rem 'Syne', sans-serif; color: var(--text2);
            letter-spacing: 1px; line-height: 1.5;
        }
        .cart-notice ul { margin: 6px 0 0; padding-left: 16px; }
        .cart-notice.show { display: block; }

        /* ===== Envío (Fase 5) ===== */
        .cart-shipping { margin: 1.5rem 0 0; padding: 1.5rem 0 0; border-top: 1px solid rgba(255,255,255,0.06); }
        .cart-section-title {
            font: 600 0.7rem 'Syne', sans-serif; color: rgba(255,255,255,0.4);
            text-transform: uppercase; letter-spacing: 3px; margin-bottom: 1.2rem;
        }
        .cart-field { display: block; margin-bottom: 1rem; }
        .cart-field > span {
            display: block; font: 400 0.62rem 'Syne', sans-serif; color: var(--text2);
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 0.4rem;
        }
        .cart-field select, .cart-field input {
            width: 100%; padding: 12px 14px;
            background: rgba(255,255,255,0.04); color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            font: 400 0.85rem 'Syne', sans-serif; letter-spacing: 0.5px;
        }
        .cart-field select { appearance: none; cursor: pointer; }
        .cart-field input::placeholder { color: rgba(255,255,255,0.25); }
        .cart-field select:focus, .cart-field input:focus { outline: none; border-color: rgba(255,255,255,0.5); }
        .cart-field.invalid select, .cart-field.invalid input { border-color: #ff5a5a; }
        .cart-ship-note {
            font: 400 0.68rem 'Syne', sans-serif; color: var(--text2);
            letter-spacing: 1px; min-height: 1em; margin-top: 0.2rem;
        }
        .cart-total-sub { font: 500 0.85rem 'Syne', sans-serif; color: var(--text2); }
        .cart-total-row + .cart-total-row { margin-top: 0.5rem; }

        /* ===== Cupón (Fase 6) ===== */
        .cart-coupon { margin-bottom: 1.2rem; }
        .cart-coupon-input { display: flex; gap: 8px; }
        .cart-coupon-input input {
            flex: 1; padding: 12px 14px;
            background: rgba(255,255,255,0.04); color: #fff;
            border: 1px solid rgba(255,255,255,0.15);
            font: 400 0.8rem 'Syne', sans-serif; letter-spacing: 1px; text-transform: uppercase;
        }
        .cart-coupon-input input::placeholder { color: rgba(255,255,255,0.25); text-transform: none; }
        .cart-coupon-input input:focus { outline: none; border-color: rgba(255,255,255,0.5); }
        .cart-coupon-input button {
            padding: 0 18px; background: transparent; color: #fff;
            border: 1px solid rgba(255,255,255,0.3);
            font: 700 0.62rem 'Syne', sans-serif; letter-spacing: 2px; cursor: pointer;
            transition: all 0.3s;
        }
        .cart-coupon-input button:hover { background: #fff; color: #000; }
        .cart-coupon-input button:disabled { opacity: 0.4; cursor: default; }
        .cart-coupon-applied {
            display: flex; align-items: center; justify-content: space-between; gap: 10px;
            padding: 10px 14px; border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.04);
            font: 600 0.72rem 'Syne', sans-serif; color: #fff; letter-spacing: 1px;
        }
        .cart-coupon-remove {
            background: none; border: none; color: var(--text2); cursor: pointer;
            font: 400 0.65rem 'Syne', sans-serif; text-transform: uppercase; letter-spacing: 1px;
            text-decoration: underline; padding: 0;
        }
        .cart-coupon-remove:hover { color: #fff; }
        .cart-coupon-msg {
            font: 400 0.68rem 'Syne', sans-serif; letter-spacing: 1px; margin-top: 0.5rem; min-height: 1em;
        }
        .cart-coupon-msg.error { color: #ff5a5a; }
        .cart-coupon-msg.ok { color: #7CFC9A; }

        /* Mensaje de checkout (estado del pedido / errores) */
        .cart-checkout-msg {
            font: 400 0.72rem 'Syne', sans-serif; letter-spacing: 1px;
            margin-top: 0.8rem; line-height: 1.5; min-height: 1em; text-align: center;
        }
        .cart-checkout-msg.error { color: #ff5a5a; }
        .cart-checkout-msg.ok { color: #7CFC9A; }

        /* Nota de progreso de envío gratis / contraentrega (Fase zonas) */
        .cart-envio-note {
            font: 400 0.68rem 'Syne', sans-serif; letter-spacing: 0.5px;
            color: var(--text2); min-height: 1em; margin: 0.2rem 0 0.4rem;
        }
        .cart-envio-note.free { color: #7CFC9A; }

        /* Confirmación de pedido (contraentrega / futuro pago) */
        .cart-confirm { text-align: center; padding: 3.5rem 1rem; }
        .cart-confirm .cc-check {
            width: 56px; height: 56px; margin: 0 auto 1.2rem; border-radius: 50%;
            border: 2px solid #7CFC9A; color: #7CFC9A; font-size: 1.6rem;
            display: flex; align-items: center; justify-content: center;
        }
        .cart-confirm .cc-title { font: 400 0.85rem 'Syne', sans-serif; color: var(--text2); letter-spacing: 1px; line-height: 1.6; max-width: 420px; margin: 0 auto; }
        .cart-confirm .cc-code { font: 700 1.4rem 'Syne', sans-serif; letter-spacing: 2px; margin: 1rem 0; }
        .cart-confirm .cc-link { display: inline-block; margin-top: 0.5rem; color: #fff; text-decoration: underline; font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; }


        @media (max-width: 900px) {
            .cart-btn { top: 0.8rem; right: 0.8rem; }
            .cart-btn img { width: 28px; height: 28px; }
            .cart-page-content { padding: 4rem 1.5rem 2rem; }
            .cart-item-img { width: 70px; height: 88px; }
        }
        @media (max-width: 480px) {
            .cart-btn img { width: 26px; height: 26px; }
            .cart-page-content { padding: 3.5rem 1.2rem 2rem; }
            .cart-item-img { width: 60px; height: 75px; }
        }

        /* ===== HERO ===== */
        .hero { width: 100%; height: 100vh; position: relative; overflow: hidden; }
        .hero-slideshow { position: absolute; inset: 0; }
        .hero-slide {
            position: absolute; inset: 0;
            opacity: 0;
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: opacity;
        }
        .hero-slide.active { opacity: 1; }
        .hero-slide img {
            width: 100%; height: 100%;
            object-fit: cover; object-position: center;
            filter: grayscale(20%) contrast(1.1);
        }
        .hero-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.5) 70%, rgba(0,0,0,0.95) 100%); z-index: 2; }
        .hero-content { position: absolute; bottom: 10%; left: 5%; z-index: 3; }
        .hero-tag { font-size: 0.65rem; letter-spacing: 5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 1rem; }
        .hero-title { font-size: clamp(4rem, 12vw, 9rem); font-weight: 800; line-height: 0.9; color: #fff; letter-spacing: -3px; }


        .hero-shop-btn {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            padding: 0.9rem 2.4rem;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: #fff;
            font-family: 'Syne', sans-serif;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 4px;
            white-space: nowrap;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .hero-shop-btn:hover {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.7);
            transform: translateX(-50%) translateY(-4px);
        }

        /* ===== SHOP PAGE (overlay) ===== */
        .shop-page {
            position: fixed; inset: 0; z-index: 7000;
            background: #000;
            visibility: hidden;
            opacity: 0;
            overflow-y: auto;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .shop-page.active { visibility: visible; opacity: 1; }
        .shop-logo {
            position: absolute; top: 0; width: 100%; height: 50px;
            display: flex; justify-content: center; align-items: center;
            z-index: 7020; pointer-events: auto;
        }
        .shop-logo img { width: 36px; height: 36px; filter: brightness(0) invert(1); cursor: pointer; transition: filter 0.5s, transform 0.3s; }
        .shop-logo img:hover { transform: scale(1.1); }
        .shop-page .collection-header { padding: 0 3rem; margin-bottom: 3rem; padding-top: 4rem; }
        .shop-page .products-grid { padding: 0 3rem; }
        .shop-page .shop-filters { padding: 0 3rem; }

        /* ===== FILTROS POR CATEGORIA (Fase 13) ===== */
        .shop-filters {
            display: flex; flex-wrap: wrap; gap: 0.6rem;
            margin: 0 0 2rem;
        }
        .filter-chip {
            padding: 0.5rem 1.1rem;
            background: transparent;
            color: var(--text3);
            border: 1px solid var(--border);
            font-family: 'Syne', sans-serif; font-size: 0.6rem; font-weight: 700;
            letter-spacing: 2px; text-transform: uppercase;
            cursor: pointer; border-radius: 100px;
            transition: all 0.3s;
        }
        .filter-chip:hover { color: var(--text); border-color: var(--text); }
        .filter-chip.active {
            background: var(--text); color: var(--bg);
            border-color: var(--text);
        }

        @media (max-width: 900px) {
            .shop-page .collection-header { padding: 0 1.5rem; padding-top: 4rem; }
            .shop-page .products-grid { padding: 0 1.5rem; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
            .shop-page .shop-filters { padding: 0 1.5rem; }
        }
        @media (max-width: 480px) {
            .shop-page .collection-header { padding: 0 1.2rem; padding-top: 3.5rem; }
            .shop-page .products-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        }

        /* ===== COLLECTION ===== */
        .products-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5rem; }
        .collection-label { font-size: 0.6rem; letter-spacing: 5px; text-transform: uppercase; color: var(--text3); }
        .collection-title { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; letter-spacing: -1px; }
        .product-card { transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.5s; cursor: pointer; }
        .product-card:hover { transform: translateY(-8px); }
        .product-img-wrap { position: relative; width: 100%; aspect-ratio: 4/5; overflow: visible; background: transparent; display: flex; align-items: center; justify-content: center; }
        .product-img-wrap img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .product-card:hover .product-img-wrap img { transform: scale(1.05) translateY(-8px); }
        [data-theme="light"] .product-img-wrap img { filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15)); }
        .product-overlay { position: absolute; bottom: -10px; left: 0; width: 100%; padding: 1.5rem 0; background: transparent; opacity: 0; transition: opacity 0.3s; display: flex; justify-content: flex-end; }
        .product-card:hover .product-overlay { opacity: 1; }
        .product-quick { padding: 0.6rem 1.2rem; background: #fff; color: #000; font-family: 'Syne', sans-serif; font-size: 0.65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; border: none; cursor: pointer; border-radius: 0; }
        .product-info { padding: 1rem 0; }
        .product-name { font-weight: 700; font-size: 1rem; margin-bottom: 0.2rem; }
        .product-cat { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 0.4rem; }
        .product-price { font-weight: 700; font-size: 1rem; }
        .product-colors { display: flex; gap: 5px; margin-top: 0.4rem; }
        .pc-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--border); }




        /* ===== PRODUCT DETAIL — ONIYOUTH STYLE ===== */
        .product-detail {
            position: fixed; inset: 0; z-index: 8000;
            background: #000;
            visibility: hidden;
            opacity: 0;
            overflow-y: auto;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .product-detail.active { visibility: visible; opacity: 1; }

        /* Close button — OniYouth style */
        .pd-close {
            position: fixed; top: 1rem; left: 1.5rem;
            width: 40px; height: 40px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 1.2rem;
            font-family: 'Syne', sans-serif; font-weight: 300;
            cursor: pointer; display: flex; align-items: center; justify-content: center;

        /* ===== RESPONSIVE ===== */

    <script>

        const tgl = document.getElementById('toggle');
        const html = document.documentElement;
        const saved = localStorage.getItem('oy-theme') || 'dark';
        html.dataset.theme = saved;
        tgl.onclick = () => { const next = html.dataset.theme === 'dark' ? 'light' : 'dark'; html.dataset.theme = next; localStorage.setItem('oy-theme', next); };

        // ===== AUDIO =====
        const audioBtn = document.getElementById('audioBtn');
        let isMuted = true;
        audioBtn.onclick = () => { isMuted = !isMuted; audioBtn.classList.toggle('on', !isMuted); };

        // ===== HERO PARALLAX =====
        const heroSlideshow = document.getElementById('heroSlideshow');
        window.addEventListener('scroll', () => { if (heroSlideshow) heroSlideshow.style.transform = `scale(1.05) translateY(${window.scrollY * 0.12}px)`; });

        // ===== HERO SLIDESHOW =====
        const slides = document.querySelectorAll('.hero-slide');
        let currentHeroSlide = 0;
        setInterval(() => {
            slides[currentHeroSlide].classList.remove('active');
            currentHeroSlide = (currentHeroSlide + 1) % slides.length;
            slides[currentHeroSlide].classList.add('active');
        }, 5000);

        // ===== SHOP PAGE (overlay) =====
        const shopPage = document.getElementById('shopPage');
        let shopIsOpen = false;

        function openShop() {
            shopPage.classList.add('active');
            document.body.style.overflow = 'hidden';
            shopPage.scrollTop = 0;
            shopIsOpen = true;
            history.pushState({ shopOpen: true }, '');
        }

        let skipNextPopstate = false;

        function closeShop() {
            shopPage.classList.remove('active');
            document.body.style.overflow = '';
            shopIsOpen = false;
            if (history.state && history.state.shopOpen) {
                skipNextPopstate = true;
                history.back();
            }
        }

        // ===== CONFIG PÚBLICA (Supabase) =====
        // La anon key es pública por diseño: el acceso a datos lo restringe RLS
        // (verificado tabla por tabla). NO es un secreto. Sin build, va directo aquí.
        const SUPABASE_URL      = 'https://oblekapcdajpueiteukv.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ibGVrYXBjZGFqcHVlaXRldWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MDkxNjAsImV4cCI6MjEwMjQ4NTE2MH0.PN5wYLnftHUhVDct_cggSBnLwsvH7x10GrSY9YMiJvQ'; // pública — reemplazar

        // ===== CATÁLOGO (desde Supabase, solo lectura vía RLS) =====
        let data = {};        // id -> producto

        // ===== ENVÍO / DISTRITOS (Fase 5) =====
        // El costo de envío viene de la tabla `distritos` (lectura pública por RLS).
        // La tabla puede estar vacía: se maneja con un estado deshabilitado.
        // El total real se recalcula igualmente en /api antes de cobrar (Fase 7).
        let districts = [];
        let districtByName = {};          // nombre -> {costo_envio, dias_estimados}

        const SHIP_KEY = 'oy-ship';
        let shipping = loadShipping();

        const EMPTY_SHIP = { nombre: '', email: '', distrito: '', direccion: '', telefono: '', referencia: '' };

        function loadShipping() {
            try {
                const s = JSON.parse(localStorage.getItem(SHIP_KEY) || '{}');
                return {
                    nombre:     s.nombre     || '',
                    email:      s.email      || '',
                    distrito:   s.distrito   || '',
                    direccion:  s.direccion  || '',
                    telefono:   s.telefono   || '',
                    referencia: s.referencia || ''
                };
            } catch (e) { return { ...EMPTY_SHIP }; }
        }

        function saveShipping() {
            const g = id => { const el = document.getElementById(id); return el ? el.value.trim() : ''; };
            shipping = {
                nombre:     g('shipNombre'),
                email:      g('shipEmail'),
                distrito:   g('shipDistrito'),
                direccion:  g('shipDireccion'),
                telefono:   g('shipTelefono'),
                referencia: g('shipReferencia')
            };
            try { localStorage.setItem(SHIP_KEY, JSON.stringify(shipping)); } catch (e) {}
        }

        async function loadDistricts() {
            try {
                districts = await sbFetch('zonas_envio?select=nombre,costo_envio,dias_estimados,contraentrega&order=nombre.asc');
            } catch (e) {
                console.error('No se pudieron cargar los distritos:', e);
                districts = [];
            }
            districtByName = {};
            districts.forEach(d => { districtByName[d.nombre] = d; });
            // Si el distrito guardado ya no existe, lo limpiamos
            if (shipping.distrito && !districtByName[shipping.distrito]) shipping.distrito = '';
            populateDistritoSelect();
        }

        // Envío gratis por encima de este subtotal (solo VISUAL; el servidor
        // recalcula y manda). Estricto: > 299.
        const UMBRAL_ENVIO_GRATIS = 299;

        function populateDistritoSelect() {
            const sel = document.getElementById('shipDistrito');
            if (!sel) return;
            if (districts.length === 0) {
                sel.innerHTML = '<option value="">No hay zonas disponibles aun</option>';
                sel.disabled = true;
            } else {
                sel.disabled = false;
                sel.innerHTML = '<option value="">Selecciona tu zona...</option>' +
                    districts.map(d => {
                        const etiqueta = d.contraentrega
                            ? 'Contraentrega'
                            : 'S/ ' + (Number(d.costo_envio) || 0).toFixed(2);
                        return '<option value="' + escapeHtml(d.nombre) + '">' +
                            escapeHtml(d.nombre) + ' — ' + etiqueta + '</option>';
                    }).join('');
                if (shipping.distrito) sel.value = shipping.distrito;
            }
            updateShipNote();
        }

        function updateShipNote() {
            const note = document.getElementById('shipNote');
            if (!note) return;
            const d = districtByName[shipping.distrito];
            if (!d) { note.textContent = ''; return; }
            if (d.contraentrega) { note.textContent = 'Contraentrega — pagas al recibir'; return; }
            note.textContent = 'Entrega estimada: ' + d.dias_estimados +
                (Number(d.dias_estimados) === 1 ? ' dia habil' : ' dias habiles');
        }

        // Resumen de importes. Reglas de envío (contraentrega y gratis > 299)
        // se muestran aquí solo para UX; el SERVIDOR (crear-preferencia)
        // recalcula todo y es el que manda. El descuento del cupón también
        // viene del servidor.
        function getCartSummary() {
            const subtotal = cart.reduce((s, it) => s + it.priceNum * it.qty, 0);
            const z = districtByName[shipping.distrito] || null;
            const contraentrega = !!(z && z.contraentrega);
            let envio = 0, envioGratis = false;
            if (z && !contraentrega) {
                if (subtotal > UMBRAL_ENVIO_GRATIS) { envio = 0; envioGratis = true; }
                else { envio = Number(z.costo_envio) || 0; }
            }
            let descuento = (coupon && coupon.valido) ? (Number(coupon.descuento) || 0) : 0;
            if (descuento > subtotal) descuento = subtotal;   // nunca más que el subtotal
            const total = Math.max(0, subtotal - descuento + envio);
            return { subtotal, envio, descuento, total, envioGratis, contraentrega, zona: z };
        }

        function onDistritoChange() {
            saveShipping();
            updateShipNote();
            renderCart();
        }

        function applyShippingToForm() {
            const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = v || ''; };
            set('shipNombre', shipping.nombre);
            set('shipEmail', shipping.email);
            set('shipDireccion', shipping.direccion);
            set('shipTelefono', shipping.telefono);
            set('shipReferencia', shipping.referencia);
            const sel = document.getElementById('shipDistrito');
            if (sel && shipping.distrito && districtByName[shipping.distrito]) sel.value = shipping.distrito;
            updateShipNote();
        }

        // ===== CUPÓN (Fase 6) — la validación SIEMPRE es del servidor =====
        // El navegador nunca decide el descuento: llama a /api/validar-cupon y
        // solo muestra lo que responde. Persistimos SOLO el código (no el monto);
        // se re-valida al abrir la bolsa y el importe final lo recalcula
        // /api/crear-preferencia (Fase 7). Requiere backend (Vercel), no Pages.
        const COUPON_KEY = 'oy-coupon';
        const COUPON_API = '/api/validar-cupon';
        let coupon = loadCoupon();   // { codigo, descuento, valido } | null

        function loadCoupon() {
            try {
                const c = JSON.parse(localStorage.getItem(COUPON_KEY) || 'null');
                if (c && c.codigo) return { codigo: String(c.codigo), descuento: 0, valido: false };
            } catch (e) {}
            return null;
        }

        function saveCoupon() {
            try {
                if (coupon && coupon.codigo) localStorage.setItem(COUPON_KEY, JSON.stringify({ codigo: coupon.codigo }));
                else localStorage.removeItem(COUPON_KEY);
            } catch (e) {}
        }

        function setCouponMsg(text, kind) {
            const el = document.getElementById('couponMsg');
            if (!el) return;
            el.textContent = text || '';
            el.className = 'cart-coupon-msg' + (kind ? ' ' + kind : '');
        }

        async function requestCouponValidation(codigo) {
            const subtotal = cart.reduce((s, it) => s + it.priceNum * it.qty, 0);
            const r = await fetch(COUPON_API, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ codigo, subtotal })
            });
            return r.json();
        }

        async function applyCoupon() {
            const input = document.getElementById('couponCode');
            const codigo = (input ? input.value : '').trim().toUpperCase();
            if (!codigo) { setCouponMsg('Ingresa un codigo', 'error'); return; }
            const btn = document.getElementById('couponApplyBtn');
            if (btn) { btn.disabled = true; btn.textContent = '...'; }
            setCouponMsg('Validando...', '');
            try {
                const res = await requestCouponValidation(codigo);
                if (res && res.valido) {
                    coupon = { codigo: res.codigo, descuento: Number(res.descuento) || 0, valido: true };
                    saveCoupon();
                    setCouponMsg('', '');
                } else {
                    coupon = null; saveCoupon();
                    setCouponMsg((res && res.mensaje) || 'Cupon invalido', 'error');
                }
            } catch (e) {
                console.error('applyCoupon:', e);
                setCouponMsg('No se pudo validar el cupon', 'error');
            } finally {
                if (btn) { btn.disabled = false; btn.textContent = 'APLICAR'; }
                renderCart();
            }
        }

        function removeCoupon() {
            coupon = null;
            saveCoupon();
            setCouponMsg('', '');
            const input = document.getElementById('couponCode');
            if (input) input.value = '';
            renderCart();
        }

        // Re-valida el cupón guardado al abrir la bolsa (el subtotal pudo cambiar).
        async function revalidateCoupon() {
            if (!coupon || !coupon.codigo) return;
            try {
                const res = await requestCouponValidation(coupon.codigo);
                if (res && res.valido) {
                    coupon = { codigo: res.codigo, descuento: Number(res.descuento) || 0, valido: true };
                } else {
                    setCouponMsg((res && res.mensaje) || 'El cupon ya no es valido', 'error');
                    coupon = null;
                }
            } catch (e) {
                // Sin servidor no se puede afirmar un descuento: no se aplica.
                console.error('revalidateCoupon:', e);
                if (coupon) coupon.valido = false;
            }
            saveCoupon();
        }

        // Refleja el estado del cupón en la UI. Recibe el descuento ya calculado.
        function renderCouponUI(descuento) {
            const inputRow = document.getElementById('couponInputRow');
            const appliedRow = document.getElementById('couponApplied');
            const appliedText = document.getElementById('couponAppliedText');
            const rowDesc = document.getElementById('rowDescuento');
            const descEl = document.getElementById('cartDescuento');
            const applied = !!(coupon && coupon.valido && descuento > 0);
            if (inputRow) inputRow.style.display = applied ? 'none' : 'flex';
            if (appliedRow) appliedRow.style.display = applied ? 'flex' : 'none';
            if (applied && appliedText) appliedText.textContent = 'Cupon ' + coupon.codigo;
            if (rowDesc) rowDesc.style.display = applied ? 'flex' : 'none';
            if (descEl) descEl.textContent = '- S/ ' + (Number(descuento) || 0).toFixed(2);
        }

        const SIZE_ORDER = ['XS', 'S', 'M', 'L', 'XL', 'XXL', 'XXXL'];
        function sizeRank(t) { const i = SIZE_ORDER.indexOf(String(t || '').toUpperCase()); return i < 0 ? 99 : i; }

        function escapeHtml(s) {
            return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        async function sbFetch(path) {
            const r = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
                headers: { apikey: SUPABASE_ANON_KEY, Authorization: 'Bearer ' + SUPABASE_ANON_KEY }
            });
            if (!r.ok) throw new Error('Supabase ' + r.status);
            return r.json();
        }

        async function loadCatalog() {
            const rows = await sbFetch(
                'productos?activo=eq.true' +
                '&select=id,nombre,descripcion,precio,categoria,imagenes,orden,variantes(id,talla,stock,sku)' +
                '&order=orden.asc'
            );
            data = {};
            rows.forEach(p => {
                const variantes = (p.variantes || []).slice().sort((a, b) => sizeRank(a.talla) - sizeRank(b.talla));
                const soldOut = variantes.length > 0 && variantes.every(v => (v.stock || 0) <= 0);
                const precioNum = Number(p.precio) || 0;
                const imgs = (Array.isArray(p.imagenes) && p.imagenes.length) ? p.imagenes : ['assets/images/logo.png'];
                data[p.id] = {
                    id: p.id, name: p.nombre, cat: p.categoria || '',
                    priceNum: precioNum, price: 'S/ ' + precioNum.toFixed(2),
                    desc: p.descripcion || '', slides: imgs,
                    variantes: variantes, soldOut: soldOut
                };
            });
            renderFilters();
            renderGrid();
        }

        // ===== FILTROS POR CATEGORIA (Fase 13) =====
        // Chips generados desde las categorias distintas del catalogo. Con una
        // sola categoria la barra se oculta (no aporta). Reusa renderGrid().
        let currentFilter = 'ALL';

        function renderFilters() {
            const bar = document.getElementById('shopFilters');
            if (!bar) return;
            const cats = [];
            Object.values(data).forEach(p => { if (p.cat && cats.indexOf(p.cat) === -1) cats.push(p.cat); });
            if (cats.length < 2) { bar.style.display = 'none'; bar.innerHTML = ''; currentFilter = 'ALL'; return; }
            if (currentFilter !== 'ALL' && cats.indexOf(currentFilter) === -1) currentFilter = 'ALL';
            bar.style.display = 'flex';
            bar.innerHTML = '';
            [['ALL', 'Todos']].concat(cats.map(c => [c, c])).forEach(pair => {
                const btn = document.createElement('button');
                btn.className = 'filter-chip' + (pair[0] === currentFilter ? ' active' : '');
                btn.textContent = pair[1];
                btn.dataset.cat = pair[0];
                btn.addEventListener('click', () => setFilter(pair[0]));
                bar.appendChild(btn);
            });
        }

        function setFilter(cat) {
            currentFilter = cat;
            document.querySelectorAll('#shopFilters .filter-chip').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
            renderGrid();
        }

        function renderGrid() {
            const track = document.getElementById('track');
            if (!track) return;
            let list = Object.values(data);
            if (currentFilter !== 'ALL') list = list.filter(p => p.cat === currentFilter);
            if (list.length === 0) {
                track.innerHTML = '<div class="grid-status">' + (currentFilter === 'ALL' ? 'No hay productos disponibles.' : 'No hay productos en esta categoria.') + '</div>';
                return;
            }
            // Agotados al final (el sort estable conserva el orden por "orden")
            list.sort((a, b) => (a.soldOut ? 1 : 0) - (b.soldOut ? 1 : 0));
            track.innerHTML = list.map(p =>
                '<div class="product-card' + (p.soldOut ? ' sold-out' : '') + '" data-p="' + p.id + '" onclick="openProduct(\'' + p.id + '\')">' +
                    '<div class="product-img-wrap">' +
                        '<img src="' + escapeHtml(p.slides[0]) + '" alt="' + escapeHtml(p.name) + '" loading="lazy">' +
                        '<div class="product-overlay"><button class="product-quick">Vista Rapida</button></div>' +
                        (p.soldOut ? '<div class="product-badge-sold">AGOTADO</div>' : '') +
                    '</div>' +
                    '<div class="product-info">' +
                        '<div class="product-cat">' + escapeHtml(p.cat) + '</div>' +
                        '<div class="product-name">' + escapeHtml(p.name) + '</div>' +
                        '<div class="product-price">' + p.price + '</div>' +
                    '</div>' +
                '</div>'
            ).join('');
        }

        // Carga inicial del catálogo
        loadCatalog().catch(err => {
            console.error('Error cargando catálogo:', err);
            const track = document.getElementById('track');
            if (track) track.innerHTML = '<div class="grid-status">No se pudo cargar la coleccion. Recarga la pagina.</div>';
        });

        // ===== PRODUCT DETAIL (Carousel) =====
        const productDetail = document.getElementById('productDetail');
        let currentSlide = 0;
        let slideCount = 0;
        let currentProductData = null;

        function openProduct(id) {
            const p = data[id]; if (!p) return;
            populateProduct(p);
            productDetail.classList.add('active');
            document.body.style.overflow = 'hidden';
            productDetail.scrollTop = 0;
            history.pushState({ productOpen: true }, '');
        }

        function closeProduct() {
            closeGallery();
            productDetail.classList.remove('active');
            document.body.style.overflow = '';
            if (history.state && history.state.productOpen) {
                skipNextPopstate = true;
                history.back();
            }
        }

        // Back button / popstate
        window.addEventListener('popstate', function(e) {
            if (skipNextPopstate) {
                skipNextPopstate = false;
                return;
            }
            if (fsIsOpen) {
                fsIsOpen = false;
                fsGallery.classList.remove('active');
                return;
            }
            if (cartIsOpen) {
                document.getElementById('cartPage').classList.remove('active');
                document.body.style.overflow = '';
                cartIsOpen = false;
                return;
            }
            if (productDetail.classList.contains('active')) {
                productDetail.classList.remove('active');
                document.body.style.overflow = '';
                return;
            }
            if (shopIsOpen) {
                shopPage.classList.remove('active');
                document.body.style.overflow = '';
                shopIsOpen = false;
                return;
            }
        });

        function populateProduct(p) {
            document.getElementById('pdCat').textContent = p.cat;
            document.getElementById('pdName').textContent = p.name;
            document.getElementById('pdPrice').textContent = p.price;
            document.getElementById('pdDesc').textContent = p.desc;

            // Tallas dinámicas desde variantes. Sin stock => tachada y deshabilitada.
            const sizesEl = document.getElementById('pdSizes');
            sizesEl.innerHTML = '';
            sizeSelected = false;
            let firstAvailable = null;
            (p.variantes || []).forEach(v => {
                const btn = document.createElement('button');
                btn.className = 'pd-sz';
                btn.textContent = v.talla;
                btn.dataset.varianteId = v.id;
                btn.dataset.stock = v.stock;
                if ((v.stock || 0) <= 0) {
                    btn.classList.add('agotada');
                    btn.disabled = true;
                } else {
                    btn.onclick = () => selSz(btn);
                    if (!firstAvailable) firstAvailable = btn;
                }
                sizesEl.appendChild(btn);
            });
            if (firstAvailable) { firstAvailable.classList.add('sel'); sizeSelected = true; }

            slideCount = p.slides.length;
            currentSlide = 0;
            currentProductData = p;

            const addBtn = document.getElementById('pdAddBtn');
            if (addBtn) {
                if (p.soldOut) { addBtn.textContent = 'AGOTADO'; addBtn.disabled = true; }
                else { addBtn.textContent = 'AGREGAR A LA BOLSA'; addBtn.disabled = false; }
            }

            // Set main image
            document.getElementById('pdMainImg').src = p.slides[0];
            document.getElementById('pdMainImg').alt = p.name;

            // Build thumbnails
            const thumbsEl = document.getElementById('pdThumbs');
            thumbsEl.innerHTML = '';
            p.slides.forEach((src, i) => {
                const thumb = document.createElement('div');
                thumb.className = 'pd-thumb' + (i === 0 ? ' active' : '');
                thumb.onclick = () => goToSlide(i);
                const img = document.createElement('img');
                img.src = src;
                img.alt = p.name + ' ' + (i + 1);
                thumb.appendChild(img);
                thumbsEl.appendChild(thumb);
            });

            // Con una sola imagen, las flechas y las miniaturas no aportan: se ocultan.
            const multiImg = p.slides.length > 1;
            thumbsEl.style.display = multiImg ? 'flex' : 'none';
            document.querySelectorAll('#pdMainImgWrap .pd-img-nav').forEach(a => { a.style.display = multiImg ? 'flex' : 'none'; });
        }

        function goToSlide(index) {
            if (index < 0) index = slideCount - 1;
            if (index >= slideCount) index = 0;
            currentSlide = index;

            if (currentProductData) {
                document.getElementById('pdMainImg').src = currentProductData.slides[currentSlide];
            }
            document.querySelectorAll('.pd-thumb').forEach((t, i) => t.classList.toggle('active', i === currentSlide));
        }

        function switchSlide(dir) { goToSlide(currentSlide + dir); }

        // ===== DOUBLE-TAP & LONG-PRESS -> OPEN GALLERY =====
        const mainImgWrap = document.getElementById('pdMainImgWrap');
        let lastTapTime = 0;
        let longPressTimer = null;
        let longPressTriggered = false;

        mainImgWrap.addEventListener('click', e => {
            if (e.target.closest('.pd-img-nav')) return;
            const now = Date.now();
            if (now - lastTapTime < 350) {
                openGallery(currentSlide);
                lastTapTime = 0;
            } else {
                lastTapTime = now;
            }
        });

        mainImgWrap.addEventListener('touchstart', e => {
            if (e.target.closest('.pd-img-nav')) return;
            longPressTriggered = false;
            longPressTimer = setTimeout(() => {
                longPressTriggered = true;
                openGallery(currentSlide);
            }, 500);
        }, { passive: true });

        mainImgWrap.addEventListener('touchmove', () => { clearTimeout(longPressTimer); }, { passive: true });
        mainImgWrap.addEventListener('touchend', () => { clearTimeout(longPressTimer); }, { passive: true });

        // Swipe on main image
        let pdTouchStartX = 0;
        mainImgWrap.addEventListener('touchstart', e => {
            if (e.target.closest('.pd-img-nav')) return;
            pdTouchStartX = e.touches[0].clientX;
        }, { passive: true });

        mainImgWrap.addEventListener('touchend', e => {
            if (e.target.closest('.pd-img-nav')) return;
            if (longPressTriggered) return;
            const diff = pdTouchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 60) {
                if (diff > 0) switchSlide(1);
                else switchSlide(-1);
            }
        }, { passive: true });

        // ===== FULL-SCREEN GALLERY (Vertical Stack) =====
        const fsGallery = document.getElementById('fsGallery');
        const fsVerticalScroll = document.getElementById('fsVerticalScroll');
        const fsCounter = document.getElementById('fsCounter');
        let fsIsOpen = false;

        function openGallery(startIdx) {
            if (!currentProductData || fsIsOpen) return;
            fsIsOpen = true;
            history.pushState({ galleryOpen: true }, '');

            // Build vertical stack
            fsVerticalScroll.innerHTML = '';
            currentProductData.slides.forEach((src, i) => {
                const block = document.createElement('div');
                block.className = 'fs-img-block';
                const img = document.createElement('img');
                img.src = src;
                img.alt = currentProductData.name + ' ' + (i + 1);
                block.appendChild(img);
                fsVerticalScroll.appendChild(block);
            });

            fsCounter.textContent = currentProductData.slides.length + ' fotos';
            fsGallery.classList.add('active');
            fsGallery.scrollTop = 0;
        }

        function closeGallery() {
            if (!fsIsOpen) return;
            fsIsOpen = false;
            fsGallery.classList.remove('active');
            if (history.state && history.state.galleryOpen) {
                skipNextPopstate = true;
                history.back();
            }
        }

        // Keyboard
        document.addEventListener('keydown', e => {
            if (fsIsOpen) {
                if (e.key === 'Escape') { closeGallery(); return; }
            }
            if (!productDetail.classList.contains('active')) return;
            if (e.key === 'Escape') closeProduct();
            if (e.key === 'ArrowRight') switchSlide(1);
            if (e.key === 'ArrowLeft') switchSlide(-1);
        });

        // Helpers
        let sizeSelected = false;
        function selSz(btn) {
            document.querySelectorAll('.pd-sz').forEach(b => b.classList.remove('sel'));
            btn.classList.add('sel');
            sizeSelected = true;
            const addBtn = document.getElementById('pdAddBtn');
            if (addBtn) addBtn.textContent = 'AGREGAR A LA BOLSA';
        }

        // ===== CART SYSTEM =====
        // ===== CARRITO (Fase 4) =====
        // Persistente en localStorage. La fuente de verdad del stock sigue
        // siendo el servidor: al abrir la bolsa se revalida contra Supabase
        // (no vale guardar algo que se agoto hace dias). El precio final se
        // recalcula igualmente en /api antes de cobrar (Fase 7).
        const CART_KEY = 'oy-cart';

        function loadCart() {
            try {
                const raw = localStorage.getItem(CART_KEY);
                const arr = raw ? JSON.parse(raw) : [];
                if (!Array.isArray(arr)) return [];
                // Solo items con lo minimo indispensable
                return arr.filter(it => it && it.variante_id && it.qty > 0);
            } catch (e) {
                console.warn('Carrito corrupto en localStorage, se reinicia.', e);
                return [];
            }
        }

        function saveCart() {
            try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); }
            catch (e) { console.warn('No se pudo guardar el carrito.', e); }
        }

        let cart = loadCart();
        updateCartBadge();  // refleja el carrito persistido al cargar la pagina

        function getSelectedSize() {
            const sel = document.querySelector('.pd-sz.sel');
            return sel ? sel.textContent : 'M';
        }

        function addCart(btn) {
            if (!currentProductData) return;
            const sel = document.querySelector('.pd-sz.sel');
            if (!sel || sel.disabled) {
                document.querySelectorAll('.pd-sz:not(.agotada)').forEach(s => { s.style.outlineColor = 'rgba(255,255,255,0.6)'; setTimeout(() => s.style.outlineColor = '', 600); });
                return;
            }

            const p = currentProductData;
            const size = sel.textContent;
            const varianteId = sel.dataset.varianteId;

            // Mismo variante (producto + talla) ya en la bolsa => suma cantidad
            const existing = cart.find(item => item.variante_id === varianteId);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({
                    producto_id: p.id,
                    variante_id: varianteId,
                    name: p.name,
                    cat: p.cat,
                    price: p.price,
                    priceNum: p.priceNum,
                    size: size,
                    img: p.slides[0],
                    qty: 1
                });
            }

            // Button feedback
            btn.textContent = 'AGREGADO!';
            btn.style.background = '#000';
            btn.style.color = '#fff';
            btn.style.border = '1px solid #fff';
            setTimeout(() => { btn.textContent = 'AGREGAR A LA BOLSA'; btn.style.background = ''; btn.style.color = ''; btn.style.border = ''; }, 1800);

            saveCart();
            updateCartBadge();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            saveCart();
            renderCart();
            updateCartBadge();
        }

        function updateCartBadge() {
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            ['cartBadgeHero', 'cartBadgeShop', 'cartBadgeDetail'].forEach(id => {
                const badge = document.getElementById(id);
                if (badge) {
                    badge.textContent = total;
                    badge.classList.toggle('show', total > 0);
                }
            });
        }

        function renderCart() {
            const itemsEl = document.getElementById('cartItems');
            const footerEl = document.getElementById('cartFooter');
            const shippingEl = document.getElementById('cartShipping');

            if (cart.length === 0) {
                itemsEl.innerHTML = '<div class="cart-empty">Tu bolsa esta vacia</div>';
                footerEl.style.display = 'none';
                if (shippingEl) shippingEl.style.display = 'none';
                return;
            }

            let html = '';
            cart.forEach((item, i) => {
                html += '<div class="cart-item">' +
                    '<div class="cart-item-img"><img src="' + escapeHtml(item.img) + '" alt="' + escapeHtml(item.name) + '"></div>' +
                    '<div class="cart-item-info">' +
                        '<div class="cart-item-name">' + escapeHtml(item.name) + '</div>' +
                        '<div class="cart-item-meta">Talla: ' + escapeHtml(item.size) + (item.qty > 1 ? ' &middot; Cant: ' + item.qty : '') + '</div>' +
                        '<div class="cart-item-price">S/ ' + (item.priceNum * item.qty).toFixed(2) + '</div>' +
                    '</div>' +
                    '<button class="cart-item-remove" onclick="removeFromCart(' + i + ')">&times;</button>' +
                '</div>';
            });
            itemsEl.innerHTML = html;

            if (shippingEl) shippingEl.style.display = 'block';
            applyShippingToForm();

            // Desglose Subtotal / Descuento / Envío / Total
            const s = getCartSummary();
            renderCouponUI(s.descuento);
            const subEl = document.getElementById('cartSubtotal');
            const envEl = document.getElementById('cartEnvio');
            if (subEl) subEl.textContent = 'S/ ' + s.subtotal.toFixed(2);
            if (envEl) {
                if (!shipping.distrito) envEl.textContent = '—';
                else if (s.contraentrega) envEl.textContent = 'Contraentrega';
                else if (s.envioGratis) envEl.textContent = 'Gratis';
                else envEl.textContent = 'S/ ' + s.envio.toFixed(2);
            }
            document.getElementById('cartTotal').textContent = 'S/ ' + s.total.toFixed(2);

            // Nota de envío: contraentrega, ya-gratis, o cuánto falta para el gratis
            const envNote = document.getElementById('envioNote');
            if (envNote) {
                envNote.className = 'cart-envio-note';
                if (s.contraentrega) {
                    envNote.textContent = 'Pagas al recibir (contraentrega).';
                } else if (s.envioGratis) {
                    envNote.textContent = '¡Tienes envío gratis!';
                    envNote.classList.add('free');
                } else {
                    const falta = UMBRAL_ENVIO_GRATIS - s.subtotal;
                    envNote.textContent = falta > 0
                        ? 'Te faltan S/ ' + falta.toFixed(2) + ' para envío gratis'
                        : 'Agrega un poco más para envío gratis';
                }
            }

            // El botón cambia a "confirmar" en contraentrega (no hay pago online)
            const cbtn = document.getElementById('cartCheckoutBtn');
            if (cbtn && !cbtn.disabled) cbtn.textContent = s.contraentrega ? 'CONFIRMAR PEDIDO' : 'PAGAR';

            footerEl.style.display = 'block';
        }

        let cartIsOpen = false;

        function showCartNotice(notes) {
            const el = document.getElementById('cartNotice');
            if (!el) return;
            if (!notes || notes.length === 0) { el.classList.remove('show'); el.innerHTML = ''; return; }
            el.innerHTML = 'Ajustamos tu bolsa segun el stock disponible:' +
                '<ul>' + notes.map(n => '<li>' + escapeHtml(n) + '</li>').join('') + '</ul>';
            el.classList.add('show');
        }

        // Revalida el stock del carrito contra Supabase al abrir la bolsa.
        // RLS solo devuelve variantes de productos activos: si una variante
        // ya no aparece, el producto se desactivo o se borro => se retira.
        async function validateCartStock() {
            if (cart.length === 0) return;
            let changed = false;
            const notes = [];
            try {
                const ids = [...new Set(cart.map(i => i.variante_id))];
                const rows = await sbFetch('variantes?id=in.(' + ids.join(',') + ')&select=id,stock');
                const stockById = {};
                rows.forEach(r => { stockById[r.id] = r.stock || 0; });
                for (let i = cart.length - 1; i >= 0; i--) {
                    const item = cart[i];
                    const stock = stockById[item.variante_id];
                    if (stock === undefined || stock <= 0) {
                        notes.push(item.name + ' (' + item.size + ') ya no esta disponible');
                        cart.splice(i, 1);
                        changed = true;
                    } else if (item.qty > stock) {
                        notes.push(item.name + ' (' + item.size + '): solo quedan ' + stock);
                        item.qty = stock;
                        changed = true;
                    }
                }
            } catch (e) {
                // Si Supabase falla, no rompas la bolsa: se revalida igual en /api al pagar.
                console.error('No se pudo validar el stock del carrito:', e);
                return;
            }
            if (changed) {
                saveCart();
                updateCartBadge();
                renderCart();
                showCartNotice(notes);
            }
        }

        async function openCart() {
            showCartNotice(null);
            renderCart();
            const cartPage = document.getElementById('cartPage');
            cartPage.classList.add('active');
            document.body.style.overflow = 'hidden';
            cartPage.scrollTop = 0;
            cartIsOpen = true;
            history.pushState({ cartOpen: true }, '');
            // Carga distritos frescos, revalida stock y re-valida el cupón
            // contra el servidor; luego re-render para reflejar todo.
            await Promise.all([loadDistricts(), validateCartStock(), revalidateCoupon()]);
            if (cart.length > 0) renderCart();
        }

        function closeCart() {
            setCheckoutMsg('', '');
            const cartPage = document.getElementById('cartPage');
            cartPage.classList.remove('active');
            document.body.style.overflow = '';
            cartIsOpen = false;
            if (history.state && history.state.cartOpen) {
                skipNextPopstate = true;
                history.back();
            }
        }

        // ===== CHECKOUT (Fase 7) =====
        // El navegador NO calcula el pedido: solo envía variante_id+cantidades,
        // distrito, cupón y datos del cliente a /api/crear-preferencia, que
        // recalcula y valida TODO en el servidor. Requiere backend (Vercel).
        const CREAR_PREF_API = '/api/crear-preferencia';
        // Public Key de Mercado Pago (publica; el cobro real usa el access token
        // del servidor). Abre el modal de Checkout Pro con el preference_id.
        const MP_PUBLIC_KEY = 'TEST-89d43404-8eb5-4c8e-93b7-94c40c4a87b7';
        let mpInstance = null;

        function openCheckoutPro(preferenceId, initPoint) {
            try {
                if (typeof MercadoPago === 'undefined') {
                    if (initPoint) { window.location.href = initPoint; return; }
                    throw new Error('SDK de Mercado Pago no disponible');
                }
                if (!mpInstance) mpInstance = new MercadoPago(MP_PUBLIC_KEY, { locale: 'es-PE' });
                setCheckoutMsg('Abriendo el pago seguro de Mercado Pago...', '');
                mpInstance.checkout({ preference: { id: preferenceId }, autoOpen: true });
            } catch (e) {
                console.error('checkout pro:', e);
                if (initPoint) { window.location.href = initPoint; return; }
                setCheckoutMsg('No se pudo abrir el pago. Intenta de nuevo.', 'error');
            }
        }

        function setCheckoutMsg(text, kind) {
            const el = document.getElementById('checkoutMsg');
            if (!el) return;
            el.textContent = text || '';
            el.className = 'cart-checkout-msg' + (kind ? ' ' + kind : '');
        }

        // Validación de UX antes de enviar. El servidor revalida igual.
        function validateShippingForm() {
            saveShipping();
            const FIELDS = ['fieldNombre', 'fieldDistrito', 'fieldDireccion', 'fieldTelefono'];
            FIELDS.forEach(id => { const el = document.getElementById(id); if (el) el.classList.remove('invalid'); });
            if (districts.length === 0) {
                setCheckoutMsg('El envio aun no esta disponible. Intentalo mas tarde.', 'error');
                return false;
            }
            const problems = [];
            if (!shipping.nombre) problems.push('fieldNombre');
            if (!shipping.distrito || !districtByName[shipping.distrito]) problems.push('fieldDistrito');
            if (!shipping.direccion) problems.push('fieldDireccion');
            if (!shipping.telefono) problems.push('fieldTelefono');
            // Email es opcional; si se escribe, debe tener formato válido.
            if (shipping.email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(shipping.email)) problems.push('fieldEmail');
            if (problems.length) {
                problems.forEach(id => { const el = document.getElementById(id); if (el) el.classList.add('invalid'); });
                const first = document.getElementById(problems[0]);
                if (first) {
                    first.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    const f = first.querySelector('select, input'); if (f) f.focus();
                }
                setCheckoutMsg('Revisa los datos de envio marcados.', 'error');
                return false;
            }
            setCheckoutMsg('', '');
            return true;
        }

        async function checkout() {
            if (cart.length === 0) return;
            if (!validateShippingForm()) return;

            const btn = document.getElementById('cartCheckoutBtn');
            const payload = {
                items: cart.map(it => ({ variante_id: it.variante_id, qty: it.qty })),
                cupon: (coupon && coupon.valido) ? coupon.codigo : '',
                cliente: {
                    nombre: shipping.nombre,
                    email: shipping.email,
                    telefono: shipping.telefono,
                    direccion: shipping.direccion,
                    distrito: shipping.distrito,
                    referencia: shipping.referencia
                }
            };

            if (btn) { btn.disabled = true; btn.textContent = 'PROCESANDO...'; }
            setCheckoutMsg('Validando tu pedido...', '');

            let res, data;
            try {
                res = await fetch(CREAR_PREF_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                data = await res.json().catch(() => ({}));
            } catch (e) {
                console.error('checkout:', e);
                setCheckoutMsg('No se pudo conectar. Revisa tu conexion e intentalo de nuevo.', 'error');
                if (btn) { btn.disabled = false; btn.textContent = 'PAGAR'; }
                return;
            }
            if (btn) { btn.disabled = false; btn.textContent = 'PAGAR'; }

            // Errores de validación server-side
            if (!res.ok || data.error) { await handleCheckoutError(data); return; }

            // Contraentrega: no hay pago online. El pedido ya quedó creado y el
            // stock reservado en el servidor. Confirmamos y vaciamos la bolsa.
            if (data.contraentrega && data.pedido) {
                showOrderConfirmation(data.pedido.codigo,
                    'Pedido registrado. Pagas al recibir; te contactaremos para coordinar la entrega.');
                return;
            }

            // Checkout Pro (Fase 7b): el servidor creó la preferencia. Abrimos
            // el modal de pago de Mercado Pago con el preference_id.
            if (data.preference_id) {
                openCheckoutPro(data.preference_id, data.init_point);
                return;
            }

            // Fase 7a: el pago aún no está habilitado, pero el pedido quedó creado.
            if (data.mp_configurado === false && data.pedido) {
                const cod = data.pedido.codigo;
                const el = document.getElementById('checkoutMsg');
                el.className = 'cart-checkout-msg ok';
                el.innerHTML = 'Pedido <strong>' + escapeHtml(cod) + '</strong> registrado (total S/ ' +
                    Number(data.pedido.total).toFixed(2) + '). El pago se habilitara pronto.<br>' +
                    '<a href="/pedido?codigo=' + encodeURIComponent(cod) + '" style="color:#7CFC9A;text-decoration:underline;">Seguir mi pedido</a>';
                return;
            }

            setCheckoutMsg('Pedido recibido. Te contactaremos para completar el pago.', 'ok');
        }

        // Vacía la bolsa y muestra una confirmación con enlace de seguimiento.
        // Se usa cuando el pedido queda cerrado sin pago online (contraentrega;
        // en Fase 7b también tras un pago aprobado).
        function showOrderConfirmation(codigo, mensaje) {
            cart = []; saveCart();
            coupon = null; saveCoupon();
            updateCartBadge();
            const shipEl = document.getElementById('cartShipping');
            const footEl = document.getElementById('cartFooter');
            if (shipEl) shipEl.style.display = 'none';
            if (footEl) footEl.style.display = 'none';
            showCartNotice(null);
            document.getElementById('cartItems').innerHTML =
                '<div class="cart-confirm">' +
                    '<div class="cc-check">&#10003;</div>' +
                    '<div class="cc-title">' + escapeHtml(mensaje) + '</div>' +
                    '<div class="cc-code">' + escapeHtml(codigo) + '</div>' +
                    '<a class="cc-link" href="/pedido?codigo=' + encodeURIComponent(codigo) + '">Seguir mi pedido</a>' +
                '</div>';
        }

        // Traduce los errores del servidor a la UI y reconcilia la bolsa.
        async function handleCheckoutError(data) {
            data = data || {};
            switch (data.error) {
                case 'stock':
                case 'no_disponible':
                    setCheckoutMsg((data.mensaje || 'Stock insuficiente') + '. Ajustamos tu bolsa.', 'error');
                    await validateCartStock();
                    renderCart();
                    break;
                case 'cupon':
                    coupon = null; saveCoupon();
                    setCouponMsg(data.mensaje || 'El cupón ya no es válido', 'error');
                    renderCart();
                    setCheckoutMsg('Quitamos el cupón: ya no es válido.', 'error');
                    break;
                case 'distrito':
                    setCheckoutMsg('Selecciona un distrito válido.', 'error');
                    break;
                case 'datos':
                    validateShippingForm();
                    break;
                default:
                    setCheckoutMsg(data.mensaje || 'No se pudo procesar el pedido.', 'error');
            }
        }

        // Keyboard: Escape closes cart
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && cartIsOpen) {
                closeCart();
            }
        });
    </script>
</body>
</html>
