<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
    <title>OniYouth - Streetwear</title>
    <link rel="icon" href="assets/images/logo.png" type="image/png">
    <meta name="description" content="OniYouth - Streetwear Culture">
    <meta name="theme-color" content="#000000">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #000; --bg2: #0a0a0a; --bg-card: #111;
            --text: #fff; --text2: #888; --text3: #555;
            --border: #222; --accent: #fff;
            --logo-filter: brightness(0) invert(1);
            --nav-bg: rgba(0,0,0,0.85);
        }

        [data-theme="light"] {
            --bg: #fff; --bg2: #f5f5f5; --bg-card: #f0f0f0;
            --text: #000; --text2: #666; --text3: #aaa;
            --border: #e0e0e0; --accent: #000;
            --logo-filter: none;
            --nav-bg: rgba(255,255,255,0.9);
        }

        html { scroll-behavior: smooth; width: 100%; overflow-x: clip; }

        body {
            font-family: 'Syne', sans-serif;
            background: var(--bg);
            color: var(--text);
            width: 100%;
            transition: background 0.5s, color 0.5s;
        }

        /* ===== NAV ===== */
        nav {
            position: absolute; top: 0; width: 100%; height: 50px;
            display: flex; justify-content: center; align-items: center;
            z-index: 10;
            background: transparent;
            backdrop-filter: none; -webkit-backdrop-filter: none;
            border-bottom: none;
            transition: none;
            pointer-events: none;
        }
        .nav-logo { display: flex; align-items: center; justify-content: center; text-decoration: none; pointer-events: auto; }
        .nav-logo img { width: 36px; height: 36px; filter: var(--logo-filter); transition: filter 0.5s; }
        .nav-logo span { display: none; }
        .nav-right { display: none; }
        .audio-btn {
            width: 34px; height: 34px; border: 1px solid var(--border);
            background: transparent; color: var(--text3); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; padding: 0;
        }
        .audio-btn:hover { border-color: var(--text); color: var(--text); }
        .audio-btn svg { width: 16px; height: 16px; fill: currentColor; }
        .audio-btn .icon-muted { display: block; }
        .audio-btn .icon-unmuted { display: none; }
        .audio-btn.on .icon-muted { display: none; }
        .audio-btn.on .icon-unmuted { display: block; }
        .theme-toggle {
            width: 42px; height: 22px; background: var(--border);
            border-radius: 11px; position: relative; cursor: pointer;
            border: none; transition: background 0.3s;
        }
        .theme-toggle::after {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 16px; height: 16px; background: var(--text);
            border-radius: 50%; transition: all 0.3s;
        }
        [data-theme="light"] .theme-toggle::after { transform: translateX(20px); }

        /* ===== CART BUTTON ===== */
        .cart-btn {
            position: fixed; top: 1rem; right: 1.5rem;
            width: auto; height: auto;
            background: none;
            backdrop-filter: none; -webkit-backdrop-filter: none;
            border: none;
            border-radius: 0;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 6020; transition: transform 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
            padding: 0;
        }
        .cart-btn:hover { transform: scale(1.1); }
        .cart-btn img { width: 34px; height: 34px; filter: none; pointer-events: none; }
        .cart-badge {
            position: absolute; top: -2px; right: -6px;
            min-width: 18px; height: 18px;
            background: #fff; color: #000;
            font: 700 0.6rem 'Syne', sans-serif;
            border-radius: 9px; display: flex; align-items: center; justify-content: center;
            padding: 0 4px; pointer-events: none;
            transform: scale(0); transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .cart-badge.show { transform: scale(1); }

        /* Cart in shop page */
        .shop-page .cart-btn { z-index: 7020; }

        /* Cart in product detail */
        .product-detail .cart-btn { z-index: 8020; }

        /* ===== CART PAGE (full-screen overlay — like shop) ===== */
        .cart-page {
            position: fixed; inset: 0; z-index: 9000;
            background: #000;
            visibility: hidden;
            opacity: 0;
            overflow-y: auto;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .cart-page.active { visibility: visible; opacity: 1; }

        .cart-page-logo {
            position: absolute; top: 0; width: 100%; height: 50px;
            display: flex; justify-content: center; align-items: center;
            z-index: 9020; pointer-events: auto;
        }
        .cart-page-logo img { width: 36px; height: 36px; filter: brightness(0) invert(1); cursor: pointer; transition: filter 0.5s, transform 0.3s; }
        .cart-page-logo img:hover { transform: scale(1.1); }

        .cart-page-content {
            padding: 5rem 3rem 3rem;
            max-width: 800px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            margin-bottom: 3rem;
        }
        .cart-title {
            font: 800 clamp(2rem, 5vw, 3.5rem) 'Syne', sans-serif;
            color: #fff;
            letter-spacing: -1px;
        }
        .cart-subtitle {
            font: 400 0.65rem 'Syne', sans-serif;
            color: rgba(255,255,255,0.3); text-transform: uppercase;
            letter-spacing: 4px; margin-top: 0.5rem;
        }

        .cart-items {
            flex: 1;
        }
        .cart-empty {
            text-align: center; padding: 5rem 1rem;
            color: rgba(255,255,255,0.2);
            font: 400 0.8rem 'Syne', sans-serif;
            letter-spacing: 3px; text-transform: uppercase;
        }
        .cart-item {
            display: flex; gap: 1.5rem; padding: 1.5rem 0;
            border-bottom: 1px solid rgba(255,255,255,0.06);
            align-items: center;
        }
        .cart-item-img {
            width: 90px; height: 112px; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .cart-item-img img { width: 100%; height: 100%; object-fit: contain; }
        .cart-item-info { flex: 1; min-width: 0; }
        .cart-item-name {
            font: 700 1rem 'Syne', sans-serif; color: #fff;
        }
        .cart-item-meta {
            font: 400 0.7rem 'Syne', sans-serif;
            color: rgba(255,255,255,0.4); margin-top: 0.4rem;
            letter-spacing: 1px;
        }
        .cart-item-price {
            font: 700 1.1rem 'Syne', sans-serif; color: #fff;
            margin-top: 0.5rem;
        }
        .cart-item-remove {
            width: 32px; height: 32px; flex-shrink: 0;
            background: transparent; border: 1px solid rgba(255,255,255,0.08);
            color: rgba(255,255,255,0.3); font-size: 0.9rem;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border-radius: 50%; transition: all 0.2s;
            font-family: 'Syne', sans-serif;
        }
        .cart-item-remove:hover { background: rgba(255,255,255,0.1); color: #fff; border-color: rgba(255,255,255,0.3); }

        .cart-footer {
            padding: 2rem 0 3rem;
            border-top: 1px solid rgba(255,255,255,0.08);
            margin-top: 2rem;
        }
        .cart-total-row {
            display: flex; justify-content: space-between; align-items: baseline;
            margin-bottom: 1.5rem;
        }
        .cart-total-label {
            font: 600 0.7rem 'Syne', sans-serif;
            color: rgba(255,255,255,0.4); text-transform: uppercase;
            letter-spacing: 3px;
        }
        .cart-total-amount {
            font: 700 1.2rem 'Syne', sans-serif; color: #fff;
        }
        .cart-checkout-btn {
            width: 100%; padding: 18px;
            background: #fff; color: #000; border: none;
            font: 700 0.7rem 'Syne', sans-serif;
            text-transform: uppercase; letter-spacing: 3px;
            cursor: pointer; transition: all 0.3s;
        }
        .cart-checkout-btn:hover { background: rgba(255,255,255,0.85); }

        /* MP Payment Brick container */
        #mpPaymentBrick {
            margin-top: 1.5rem;
        }
        .cart-back-btn {
            width: 100%; padding: 14px;
            background: transparent; color: rgba(255,255,255,0.5); border: 1px solid rgba(255,255,255,0.15);
            font: 700 0.65rem 'Syne', sans-serif;
            text-transform: uppercase; letter-spacing: 3px;
            cursor: pointer; transition: all 0.3s;
            margin-top: 0.8rem;
        }
        .cart-back-btn:hover { color: #fff; border-color: rgba(255,255,255,0.4); }


        @media (max-width: 900px) {
            .cart-btn { top: 0.8rem; right: 0.8rem; }
            .cart-btn img { width: 28px; height: 28px; }
            .cart-page-content { padding: 4rem 1.5rem 2rem; }
            .cart-item-img { width: 70px; height: 88px; }
        }
        @media (max-width: 480px) {
            .cart-btn img { width: 26px; height: 26px; }
            .cart-page-content { padding: 3.5rem 1.2rem 2rem; }
            .cart-item-img { width: 60px; height: 75px; }
        }

        /* ===== HERO ===== */
        .hero { width: 100%; height: 100vh; position: relative; overflow: hidden; }
        .hero-slideshow { position: absolute; inset: 0; }
        .hero-slide {
            position: absolute; inset: 0;
            opacity: 0;
            transition: opacity 1.8s cubic-bezier(0.4, 0, 0.2, 1);
            will-change: opacity;
        }
        .hero-slide.active { opacity: 1; }
        .hero-slide img {
            width: 100%; height: 100%;
            object-fit: cover; object-position: center;
            filter: grayscale(20%) contrast(1.1);
        }
        .hero-gradient { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.5) 70%, rgba(0,0,0,0.95) 100%); z-index: 2; }
        .hero-content { position: absolute; bottom: 10%; left: 5%; z-index: 3; }
        .hero-tag { font-size: 0.65rem; letter-spacing: 5px; text-transform: uppercase; color: rgba(255,255,255,0.5); margin-bottom: 1rem; }
        .hero-title { font-size: clamp(4rem, 12vw, 9rem); font-weight: 800; line-height: 0.9; color: #fff; letter-spacing: -3px; }


        .hero-shop-btn {
            position: absolute;
            bottom: 15%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 5;
            padding: 1rem 3rem;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.08);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            color: #fff;
            font-family: 'Syne', sans-serif;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }
        .hero-shop-btn:hover {
            background: rgba(255,255,255,0.18);
            border-color: rgba(255,255,255,0.7);
            transform: translateX(-50%) translateY(-4px);
        }

        /* ===== SHOP PAGE (overlay) ===== */
        .shop-page {
            position: fixed; inset: 0; z-index: 7000;
            background: #000;
            visibility: hidden;
            opacity: 0;
            overflow-y: auto;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .shop-page.active { visibility: visible; opacity: 1; }
        .shop-logo {
            position: absolute; top: 0; width: 100%; height: 50px;
            display: flex; justify-content: center; align-items: center;
            z-index: 7020; pointer-events: auto;
        }
        .shop-logo img { width: 36px; height: 36px; filter: brightness(0) invert(1); cursor: pointer; transition: filter 0.5s, transform 0.3s; }
        .shop-logo img:hover { transform: scale(1.1); }
        .shop-page .collection-header { padding: 0 3rem; margin-bottom: 3rem; padding-top: 4rem; }
        .shop-page .products-grid { padding: 0 3rem; }

        @media (max-width: 900px) {
            .shop-page .collection-header { padding: 0 1.5rem; padding-top: 4rem; }
            .shop-page .products-grid { padding: 0 1.5rem; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
        }
        @media (max-width: 480px) {
            .shop-page .collection-header { padding: 0 1.2rem; padding-top: 3.5rem; }
            .shop-page .products-grid { grid-template-columns: repeat(2, 1fr); gap: 1rem; }
        }

        /* ===== COLLECTION ===== */
        .products-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2.5rem; }
        .collection-label { font-size: 0.6rem; letter-spacing: 5px; text-transform: uppercase; color: var(--text3); }
        .collection-title { font-size: clamp(2rem, 5vw, 3.5rem); font-weight: 800; letter-spacing: -1px; }
        .product-card { transition: transform 0.5s cubic-bezier(0.25, 0.46, 0.45, 0.94), opacity 0.5s; cursor: pointer; }
        .product-card:hover { transform: translateY(-8px); }
        .product-img-wrap { position: relative; width: 100%; aspect-ratio: 4/5; overflow: visible; background: transparent; display: flex; align-items: center; justify-content: center; }
        .product-img-wrap img { width: 100%; height: 100%; object-fit: contain; transition: transform 0.6s cubic-bezier(0.25, 0.46, 0.45, 0.94); }
        .product-card:hover .product-img-wrap img { transform: scale(1.05) translateY(-8px); }
        [data-theme="light"] .product-img-wrap img { filter: drop-shadow(0 8px 16px rgba(0,0,0,0.15)); }
        .product-overlay { position: absolute; bottom: -10px; left: 0; width: 100%; padding: 1.5rem 0; background: transparent; opacity: 0; transition: opacity 0.3s; display: flex; justify-content: flex-end; }
        .product-card:hover .product-overlay { opacity: 1; }
        .product-quick { padding: 0.6rem 1.2rem; background: #fff; color: #000; font-family: 'Syne', sans-serif; font-size: 0.65rem; font-weight: 700; letter-spacing: 2px; text-transform: uppercase; border: none; cursor: pointer; border-radius: 0; }
        .product-info { padding: 1rem 0; }
        .product-name { font-weight: 700; font-size: 1rem; margin-bottom: 0.2rem; }
        .product-cat { font-size: 0.65rem; letter-spacing: 2px; text-transform: uppercase; color: var(--text3); margin-bottom: 0.4rem; }
        .product-price { font-weight: 700; font-size: 1rem; }
        .product-colors { display: flex; gap: 5px; margin-top: 0.4rem; }
        .pc-dot { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--border); }




        /* ===== PRODUCT DETAIL — ONIYOUTH STYLE ===== */
        .product-detail {
            position: fixed; inset: 0; z-index: 8000;
            background: #000;
            visibility: hidden;
            opacity: 0;
            overflow-y: auto;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .product-detail.active { visibility: visible; opacity: 1; }

        /* Close button — OniYouth style */
        .pd-close {
            position: fixed; top: 1rem; left: 1.5rem;
            width: 40px; height: 40px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 1.2rem;
            font-family: 'Syne', sans-serif; font-weight: 300;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            z-index: 8020; transition: all 0.3s;
            border-radius: 50%;
        }
        .pd-close:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }

        /* Layout: side-by-side on desktop, stacked on mobile */
        .pd-layout {
            display: flex;
            min-height: 100vh;
            padding-top: 0;
        }

        /* Left: Main image carousel */
        .pd-images {
            flex: 1 1 55%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 4.5rem 2rem 1rem;
            position: relative;
        }

        .pd-main-img-wrap {
            position: relative;
            width: 100%;
            max-width: 500px;
            aspect-ratio: 4/5;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .pd-main-img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
        }

        /* Nav arrows */
        .pd-img-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 36px; height: 36px;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 1rem;
            font-family: 'Syne', sans-serif; font-weight: 300;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; border-radius: 50%; z-index: 5;
        }
        .pd-img-nav:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
        .pd-nav-prev { left: -0.5rem; }
        .pd-nav-next { right: -0.5rem; }

        /* Thumbnail strip */
        .pd-thumbs {
            display: flex;
            gap: 8px;
            margin-top: 1.2rem;
            justify-content: center;
        }
        .pd-thumb {
            width: 48px; height: 60px;
            border: 2px solid transparent;
            cursor: pointer;
            opacity: 0.4;
            transition: all 0.3s;
            display: flex; align-items: center; justify-content: center;
            background: transparent;
        }
        .pd-thumb img { width: 100%; height: 100%; object-fit: contain; }
        .pd-thumb.active { opacity: 1; border-color: #fff; }
        .pd-thumb:hover { opacity: 0.8; }

        /* Right: Product info */
        .pd-info {
            flex: 1 1 45%;
            padding: 5rem 2.5rem 3rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        /* OniYouth typography: Syne, clean, minimal */
        .pd-cat {
            font: 600 0.65rem 'Syne', sans-serif;
            color: rgba(255,255,255,0.4); text-transform: uppercase;
            letter-spacing: 4px; margin-bottom: 0.8rem;
        }
        .pd-name {
            font: 800 2rem 'Syne', sans-serif;
            color: #fff;
            line-height: 1.15; margin-bottom: 0.8rem;
            letter-spacing: -0.5px;
        }
        .pd-price {
            font: 700 1.2rem 'Syne', sans-serif;
            color: #fff;
            margin-bottom: 2rem;
            letter-spacing: -0.5px;
        }

        .pd-desc {
            font: 400 0.85rem 'Syne', sans-serif;
            color: rgba(255,255,255,0.5); line-height: 2;
            margin-bottom: 2rem;
            text-align: center;
            white-space: pre-line;
        }

        .pd-sizes-label {
            font: 600 0.65rem 'Syne', sans-serif;
            color: rgba(255,255,255,0.4); text-transform: uppercase;
            letter-spacing: 3px; margin-bottom: 0.8rem;
        }

        /* Size buttons — OniYouth style */
        .pd-sizes {
            display: grid;
            grid-template-columns: repeat(auto-fill, 56px);
            gap: 8px;
            margin-bottom: 2.5rem;
        }
        .pd-sz {
            width: 56px; height: 56px;
            border: none; background: transparent;
            color: rgba(255,255,255,0.5);
            font: 700 0.75rem 'Syne', sans-serif;
            cursor: pointer; transition: all 0.2s;
            display: flex; align-items: center; justify-content: center;
            outline: 1px solid rgba(255,255,255,0.12);
            border-radius: 0;
        }
        .pd-sz:hover { outline-color: rgba(255,255,255,0.4); color: #fff; }
        .pd-sz.sel {
            outline: 2px solid #fff;
            background: transparent;
            color: #fff;
        }

        /* Add to cart button — OniYouth style */
        .pd-add-btn {
            width: 100%; padding: 16px;
            margin-top: 0.5rem;
            background: #fff;
            color: #000;
            border: none;
            font: 700 0.7rem 'Syne', sans-serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .pd-desc { margin-top: 1.5rem; }
        .pd-add-btn:hover { background: rgba(255,255,255,0.85); }

        /* Image nav arrows */
        .pd-img-nav { display: flex; }

        /* ===== FULL-SCREEN GALLERY — Vertical Stack ===== */
        .fs-gallery {
            position: fixed; inset: 0; z-index: 9500;
            background: #000;
            visibility: hidden;
            opacity: 0;
            flex-direction: column;
            overflow-y: auto;
            overflow-x: hidden;
            transition: opacity 0.5s ease, visibility 0.5s;
        }
        .fs-gallery.active { visibility: visible; opacity: 1; }

        .fs-gallery-top {
            position: fixed; top: 0; left: 0; right: 0;
            display: flex; justify-content: space-between; align-items: center;
            padding: 1rem 1.5rem;
            z-index: 10;
            background: linear-gradient(to bottom, rgba(0,0,0,0.6), transparent);
        }
        .fs-close {
            width: 40px; height: 40px;
            background: rgba(0,0,0,0.4);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff; font-size: 1.2rem;
            font-family: 'Syne', sans-serif; font-weight: 300;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s; border-radius: 50%;
        }
        .fs-close:hover { background: rgba(255,255,255,0.15); border-color: rgba(255,255,255,0.3); }
        .fs-counter {
            font: 400 0.7rem 'Syne', sans-serif;
            color: rgba(255,255,255,0.5); letter-spacing: 3px;
        }

        /* Vertical stack of images — full width, large */
        .fs-vertical-scroll {
            padding: 5rem 0 0;
            width: 100%;
        }

        .fs-img-block {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .fs-img-block img {
            width: 100%;
            height: auto;
            object-fit: contain;
            display: block;
        }

        .fs-gallery-bottom { display: none; }

        @media (max-width: 900px) {
            .fs-close { width: 36px; height: 36px; font-size: 1.2rem; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .hero-content { left: 5%; right: 5%; bottom: 8%; }

</head>

    <!-- CART PAGE (full-screen overlay — like shop) -->
    <div class="cart-page" id="cartPage">

        </div>
        <div class="cart-page-content">

    <script src="https://sdk.mercadopago.com/js/v2"></script>
    <script>

        const tgl = document.getElementById('toggle');
        const html = document.documentElement;
        const saved = localStorage.getItem('oy-theme') || 'dark';
        html.dataset.theme = saved;
        tgl.onclick = () => { const next = html.dataset.theme === 'dark' ? 'light' : 'dark'; html.dataset.theme = next; localStorage.setItem('oy-theme', next); };

        // ===== AUDIO =====
        const audioBtn = document.getElementById('audioBtn');
        let isMuted = true;
        audioBtn.onclick = () => { isMuted = !isMuted; audioBtn.classList.toggle('on', !isMuted); };

        // ===== HERO PARALLAX =====
        const heroSlideshow = document.getElementById('heroSlideshow');
        window.addEventListener('scroll', () => { if (heroSlideshow) heroSlideshow.style.transform = `scale(1.05) translateY(${window.scrollY * 0.12}px)`; });

        // ===== HERO SLIDESHOW =====
        const slides = document.querySelectorAll('.hero-slide');
        let currentHeroSlide = 0;
        setInterval(() => {
            slides[currentHeroSlide].classList.remove('active');
            currentHeroSlide = (currentHeroSlide + 1) % slides.length;
            slides[currentHeroSlide].classList.add('active');
        }, 5000);

        // ===== SHOP PAGE (overlay) =====
        const shopPage = document.getElementById('shopPage');
        let shopIsOpen = false;

        function openShop() {
            shopPage.classList.add('active');
            document.body.style.overflow = 'hidden';
            shopPage.scrollTop = 0;
            shopIsOpen = true;
            history.pushState({ shopOpen: true }, '');
        }

        let skipNextPopstate = false;

        function closeShop() {
            shopPage.classList.remove('active');
            document.body.style.overflow = '';
            shopIsOpen = false;
            if (history.state && history.state.shopOpen) {
                skipNextPopstate = true;
                history.back();
            }
        }

        // ===== PRODUCT DATA =====
        const data = {
            oneoniyouth: { name: 'ONIYOUTH TRIBAL TEE', cat: 'T-shirt', price: 'S/ 89.99', desc: 'T-shirt 100% cotton 20/1\nEstampado DTG ESTRIBAL "ONIYOUTH"', slides: ['assets/images/product-oneoniyouth-front.png','assets/images/product-oneoniyouth-back.png'] },
            oniyouthstars: { name: 'oniyouth stars', cat: 'T-shirt', price: 'S/ 89.99', desc: 'T-shirt 100% cotton 20/1\nEstampado DTG ESTRIBAL en la espalda y en el pecho "ONIYOUTH STARS"', slides: ['assets/images/product-oniyouthstars-front.png','assets/images/product-oniyouthstars-back.png'] }
        };

        // ===== PRODUCT DETAIL (Carousel) =====
        const productDetail = document.getElementById('productDetail');
        let currentSlide = 0;
        let slideCount = 0;
        let currentProductData = null;

        function openProduct(id) {
            const p = data[id]; if (!p) return;
            populateProduct(p);
            productDetail.classList.add('active');
            document.body.style.overflow = 'hidden';
            productDetail.scrollTop = 0;
            history.pushState({ productOpen: true }, '');
        }

        function closeProduct() {
            closeGallery();
            productDetail.classList.remove('active');
            document.body.style.overflow = '';
            if (history.state && history.state.productOpen) {
                skipNextPopstate = true;
                history.back();
            }
        }

        // Back button / popstate
        window.addEventListener('popstate', function(e) {
            if (skipNextPopstate) {
                skipNextPopstate = false;
                return;
            }
            if (fsIsOpen) {
                fsIsOpen = false;
                fsGallery.classList.remove('active');
                return;
            }
            if (cartIsOpen) {
                document.getElementById('cartPage').classList.remove('active');
                document.body.style.overflow = '';
                cartIsOpen = false;
                return;
            }
            if (productDetail.classList.contains('active')) {
                productDetail.classList.remove('active');
                document.body.style.overflow = '';
                return;
            }
            if (shopIsOpen) {
                shopPage.classList.remove('active');
                document.body.style.overflow = '';
                shopIsOpen = false;
                return;
            }
        });

        function populateProduct(p) {
            document.getElementById('pdCat').textContent = p.cat;
            document.getElementById('pdName').textContent = p.name;
            document.getElementById('pdPrice').textContent = p.price;
            document.getElementById('pdDesc').textContent = p.desc;
            document.querySelectorAll('.pd-sz').forEach((s, i) => { s.classList.remove('sel'); if (i === 2) s.classList.add('sel'); });

            slideCount = p.slides.length;
            currentSlide = 0;
            sizeSelected = true;
            currentProductData = p;

            const addBtn = document.getElementById('pdAddBtn');
            if (addBtn) addBtn.textContent = 'AGREGAR A LA BOLSA';

            // Set main image
            document.getElementById('pdMainImg').src = p.slides[0];
            document.getElementById('pdMainImg').alt = p.name;

            // Build thumbnails
            const thumbsEl = document.getElementById('pdThumbs');
            thumbsEl.innerHTML = '';
            p.slides.forEach((src, i) => {
                const thumb = document.createElement('div');
                thumb.className = 'pd-thumb' + (i === 0 ? ' active' : '');
                thumb.onclick = () => goToSlide(i);
                const img = document.createElement('img');
                img.src = src;
                img.alt = p.name + ' ' + (i + 1);
                thumb.appendChild(img);
                thumbsEl.appendChild(thumb);
            });
        }

        function goToSlide(index) {
            if (index < 0) index = slideCount - 1;
            if (index >= slideCount) index = 0;
            currentSlide = index;

            if (currentProductData) {
                document.getElementById('pdMainImg').src = currentProductData.slides[currentSlide];
            }
            document.querySelectorAll('.pd-thumb').forEach((t, i) => t.classList.toggle('active', i === currentSlide));
        }

        function switchSlide(dir) { goToSlide(currentSlide + dir); }

        // ===== DOUBLE-TAP & LONG-PRESS -> OPEN GALLERY =====
        const mainImgWrap = document.getElementById('pdMainImgWrap');
        let lastTapTime = 0;
        let longPressTimer = null;
        let longPressTriggered = false;

        mainImgWrap.addEventListener('click', e => {
            if (e.target.closest('.pd-img-nav')) return;
            const now = Date.now();
            if (now - lastTapTime < 350) {
                openGallery(currentSlide);
                lastTapTime = 0;
            } else {
                lastTapTime = now;
            }
        });

        mainImgWrap.addEventListener('touchstart', e => {
            if (e.target.closest('.pd-img-nav')) return;
            longPressTriggered = false;
            longPressTimer = setTimeout(() => {
                longPressTriggered = true;
                openGallery(currentSlide);
            }, 500);
        }, { passive: true });

        mainImgWrap.addEventListener('touchmove', () => { clearTimeout(longPressTimer); }, { passive: true });
        mainImgWrap.addEventListener('touchend', () => { clearTimeout(longPressTimer); }, { passive: true });

        // Swipe on main image
        let pdTouchStartX = 0;
        mainImgWrap.addEventListener('touchstart', e => {
            if (e.target.closest('.pd-img-nav')) return;
            pdTouchStartX = e.touches[0].clientX;
        }, { passive: true });

        mainImgWrap.addEventListener('touchend', e => {
            if (e.target.closest('.pd-img-nav')) return;
            if (longPressTriggered) return;
            const diff = pdTouchStartX - e.changedTouches[0].clientX;
            if (Math.abs(diff) > 60) {
                if (diff > 0) switchSlide(1);
                else switchSlide(-1);
            }
        }, { passive: true });

        // ===== FULL-SCREEN GALLERY (Vertical Stack) =====
        const fsGallery = document.getElementById('fsGallery');
        const fsVerticalScroll = document.getElementById('fsVerticalScroll');
        const fsCounter = document.getElementById('fsCounter');
        let fsIsOpen = false;

        function openGallery(startIdx) {
            if (!currentProductData || fsIsOpen) return;
            fsIsOpen = true;
            history.pushState({ galleryOpen: true }, '');

            // Build vertical stack
            fsVerticalScroll.innerHTML = '';
            currentProductData.slides.forEach((src, i) => {
                const block = document.createElement('div');
                block.className = 'fs-img-block';
                const img = document.createElement('img');
                img.src = src;
                img.alt = currentProductData.name + ' ' + (i + 1);
                block.appendChild(img);
                fsVerticalScroll.appendChild(block);
            });

            fsCounter.textContent = currentProductData.slides.length + ' fotos';
            fsGallery.classList.add('active');
            fsGallery.scrollTop = 0;
        }

        function closeGallery() {
            if (!fsIsOpen) return;
            fsIsOpen = false;
            fsGallery.classList.remove('active');
            if (history.state && history.state.galleryOpen) {
                skipNextPopstate = true;
                history.back();
            }
        }

        // Keyboard
        document.addEventListener('keydown', e => {
            if (fsIsOpen) {
                if (e.key === 'Escape') { closeGallery(); return; }
            }
            if (!productDetail.classList.contains('active')) return;
            if (e.key === 'Escape') closeProduct();
            if (e.key === 'ArrowRight') switchSlide(1);
            if (e.key === 'ArrowLeft') switchSlide(-1);
        });

        // Helpers
        let sizeSelected = false;
        function selSz(btn) {
            document.querySelectorAll('.pd-sz').forEach(b => b.classList.remove('sel'));
            btn.classList.add('sel');
            sizeSelected = true;
            const addBtn = document.getElementById('pdAddBtn');
            if (addBtn) addBtn.textContent = 'AGREGAR A LA BOLSA';
        }

        // ===== CART SYSTEM =====
        let cart = [];

        function getSelectedSize() {
            const sel = document.querySelector('.pd-sz.sel');
            return sel ? sel.textContent : 'M';
        }

        function addCart(btn) {
            if (!sizeSelected) {
                document.querySelectorAll('.pd-sz').forEach(s => { s.style.outlineColor = 'rgba(255,255,255,0.6)'; setTimeout(() => s.style.outlineColor = '', 600); });
                return;
            }
            if (!currentProductData) return;

            const size = getSelectedSize();
            const priceNum = parseFloat(currentProductData.price.replace(/[^\d.]/g, ''));

            // Check if same product + size already in cart
            const existing = cart.find(item => item.name === currentProductData.name && item.size === size);
            if (existing) {
                existing.qty++;
            } else {
                cart.push({
                    name: currentProductData.name,
                    cat: currentProductData.cat,
                    price: currentProductData.price,
                    priceNum: priceNum,
                    size: size,
                    img: currentProductData.slides[0],
                    qty: 1
                });
            }

            // Button feedback
            btn.textContent = 'AGREGADO!';
            btn.style.background = '#000';
            btn.style.color = '#fff';
            btn.style.border = '1px solid #fff';
            setTimeout(() => { btn.textContent = 'AGREGAR A LA BOLSA'; btn.style.background = ''; btn.style.color = ''; btn.style.border = ''; }, 1800);

            updateCartBadge();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
            updateCartBadge();
        }

        function updateCartBadge() {
            const total = cart.reduce((sum, item) => sum + item.qty, 0);
            ['cartBadgeHero', 'cartBadgeShop', 'cartBadgeDetail'].forEach(id => {
                const badge = document.getElementById(id);
                if (badge) {
                    badge.textContent = total;
                    badge.classList.toggle('show', total > 0);
                }
            });
        }

        function renderCart() {
            const itemsEl = document.getElementById('cartItems');
            const emptyEl = document.getElementById('cartEmpty');
            const footerEl = document.getElementById('cartFooter');
            const totalEl = document.getElementById('cartTotal');

            if (cart.length === 0) {
                itemsEl.innerHTML = '<div class="cart-empty">Tu bolsa esta vacia</div>';
                footerEl.style.display = 'none';
                return;
            }

            let html = '';
            cart.forEach((item, i) => {
                html += '<div class="cart-item">' +
                    '<div class="cart-item-img"><img src="' + item.img + '" alt="' + item.name + '"></div>' +
                    '<div class="cart-item-info">' +
                        '<div class="cart-item-name">' + item.name + '</div>' +
                        '<div class="cart-item-meta">Talla: ' + item.size + (item.qty > 1 ? ' &middot; Cant: ' + item.qty : '') + '</div>' +
                        '<div class="cart-item-price">S/ ' + (item.priceNum * item.qty).toFixed(2) + '</div>' +
                    '</div>' +
                    '<button class="cart-item-remove" onclick="removeFromCart(' + i + ')">&times;</button>' +
                '</div>';
            });
            itemsEl.innerHTML = html;

            const total = cart.reduce((sum, item) => sum + item.priceNum * item.qty, 0);
            totalEl.textContent = 'S/ ' + total.toFixed(2);
            footerEl.style.display = 'block';
        }

        let cartIsOpen = false;

        function openCart() {
            renderCart();
            const cartPage = document.getElementById('cartPage');
            cartPage.classList.add('active');
            document.body.style.overflow = 'hidden';
            cartPage.scrollTop = 0;
            cartIsOpen = true;
            history.pushState({ cartOpen: true }, '');
        }

        function closeCart() {
            backToCart();
            const cartPage = document.getElementById('cartPage');
            cartPage.classList.remove('active');
            document.body.style.overflow = '';
            cartIsOpen = false;
            if (history.state && history.state.cartOpen) {
                skipNextPopstate = true;
                history.back();
            }
        }

        // ===== MERCADO PAGO PAYMENT BRICK =====
        let mpBrickController = null;

        function checkout() {
            if (cart.length === 0) return;
            const total = cart.reduce((sum, item) => sum + item.priceNum * item.qty, 0);

            // Hide checkout button, show loading
            document.getElementById('cartCheckoutBtn').style.display = 'none';
            document.getElementById('mpPaymentBrick').innerHTML = '<div style="text-align:center;padding:2rem;color:rgba(255,255,255,0.4);font:400 0.75rem Syne,sans-serif;letter-spacing:2px;text-transform:uppercase;">Cargando formulario de pago...</div>';

            if (typeof MercadoPago === 'undefined') {
                document.getElementById('mpPaymentBrick').innerHTML = '<div style="text-align:center;padding:2rem;color:#ff4444;font:600 0.7rem Syne,sans-serif;letter-spacing:2px;">Error al cargar Mercado Pago. Recarga la pagina.</div>';
                document.getElementById('cartCheckoutBtn').style.display = 'block';
                return;
            }

            const mp = new MercadoPago('TEST-89d43404-8eb5-4c8e-93b7-94c40c4a87b7', {
                locale: 'es-PE'
            });

            // Build items description
            const desc = cart.map(i => i.name + ' (' + i.size + ')').join(', ');

            // Destroy previous brick if exists
            if (mpBrickController) {
                mpBrickController.unmount();
            }

            // Render Payment Brick
            mp.bricks().create('payment', 'mpPaymentBrick', {
                initialization: {
                    amount: total,
                    description: desc,
                    payer: {
                        email: ''
                    }
                },
                customization: {
                    visual: {
                        style: {
                            theme: 'dark',
                            customVariables: {
                                formBackgroundColor: '#000000',
                                baseColor: '#ffffff'
                            }
                        }
                    },
                    paymentMethods: {
                        ticket: 'all',
                        bankTransfer: 'all',
                        creditCard: 'all',
                        debitCard: 'all'
                    }
                },
                callbacks: {
                    onSubmit: ({ formData }) => {
                        return new Promise((resolve) => {
                            // Sitio estatico (GitHub Pages) sin backend: NO se puede crear el
                            // pago de forma segura desde el navegador. Para pagos reales necesitas
                            // un servidor que reciba formData y llame a la API de Mercado Pago con
                            // tu ACCESS TOKEN privado (nunca lo pongas en el frontend).
                            console.log('Payment submitted:', formData);
                            alert('Pedido recibido! Te contactaremos para completar el pago.');
                            cart = [];
                            updateCartBadge();
                            closeCart();
                            resolve();
                        });
                    },
                    onError: (error) => {
                        console.error('Payment brick error:', error);
                    },
                    onReady: () => {
                        // Remove loading text
                        const loading = document.getElementById('mpPaymentBrick').querySelector('div[style]');
                        if (loading && loading.textContent.includes('Cargando')) loading.remove();
                        document.getElementById('cartBackBtn').style.display = 'block';
                    }
                }
            }).then(controller => {
                mpBrickController = controller;
            }).catch(err => {
                document.getElementById('mpPaymentBrick').innerHTML = '<div style="text-align:center;padding:2rem;color:#ff4444;font:600 0.7rem Syne,sans-serif;letter-spacing:2px;">Error al cargar el formulario de pago.</div>';
                document.getElementById('cartCheckoutBtn').style.display = 'block';
                console.error(err);
            });
        }

        function backToCart() {
            if (mpBrickController) {
                mpBrickController.unmount();
                mpBrickController = null;
            }
            document.getElementById('mpPaymentBrick').innerHTML = '';
            document.getElementById('cartCheckoutBtn').style.display = 'block';
            document.getElementById('cartBackBtn').style.display = 'none';
        }

        // Keyboard: Escape closes cart
        document.addEventListener('keydown', e => {
            if (e.key === 'Escape' && cartIsOpen) {
                closeCart();
            }
        });
    </script>
</body>
</html>
