<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OniYouth · Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="assets/images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #000; --bg2: #0a0a0a; --card: #111; --card2: #161616;
      --text: #fff; --text2: #888; --text3: #555;
      --border: #222; --border2: #2c2c2c;
      --accent: #fff; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --info: #60a5fa;
    }
    html { -webkit-text-size-adjust: 100%; }
    body { font-family: 'Syne', sans-serif; background: var(--bg); color: var(--text); line-height: 1.4; }
    a { color: inherit; }
    button { font-family: inherit; cursor: pointer; }
    input, select, textarea {
      font-family: inherit; font-size: 0.9rem; background: var(--bg2); color: var(--text);
      border: 1px solid var(--border2); border-radius: 8px; padding: 0.55rem 0.7rem; width: 100%;
    }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--text2); }
    textarea { resize: vertical; min-height: 80px; }
    label { display: block; font-size: 0.72rem; text-transform: uppercase; letter-spacing: .06em; color: var(--text2); margin-bottom: .3rem; }
    .btn {
      background: var(--accent); color: #000; border: none; border-radius: 8px;
      padding: 0.6rem 1.1rem; font-weight: 700; font-size: 0.85rem; letter-spacing: .02em;
      transition: opacity .2s; white-space: nowrap;
    }
    .btn:hover { opacity: .85; }
    .btn:disabled { opacity: .4; cursor: not-allowed; }
    .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border2); }
    .btn.sm { padding: 0.35rem 0.7rem; font-size: 0.75rem; border-radius: 6px; }
    .btn.danger { background: transparent; color: var(--bad); border: 1px solid #402; }

    /* ===== LOGIN ===== */
    #login { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
    #login .box { width: 100%; max-width: 360px; text-align: center; }
    #login img { width: 54px; height: 54px; filter: brightness(0) invert(1); margin-bottom: 1.2rem; }
    #login h1 { font-size: 1.1rem; font-weight: 800; letter-spacing: .1em; margin-bottom: .3rem; }
    #login p.sub { color: var(--text2); font-size: 0.8rem; margin-bottom: 1.8rem; }
    #login .field { text-align: left; margin-bottom: 1rem; }
    #login .btn { width: 100%; padding: 0.75rem; margin-top: .5rem; }
    #login .err { color: var(--bad); font-size: 0.8rem; margin-top: 1rem; min-height: 1rem; }

    /* ===== APP SHELL ===== */
    #app { display: none; }
    header.bar {
      position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 1rem;
      padding: 0.7rem 1rem; background: rgba(0,0,0,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    }
    header.bar .logo { width: 28px; height: 28px; filter: brightness(0) invert(1); }
    header.bar .spacer { flex: 1; }
    header.bar .who { color: var(--text2); font-size: 0.75rem; }
    nav.tabs { display: flex; gap: .3rem; overflow-x: auto; padding: .5rem 1rem; border-bottom: 1px solid var(--border); background: var(--bg2); position: sticky; top: 49px; z-index: 19; }
    nav.tabs button {
      background: transparent; border: 1px solid transparent; color: var(--text2); font-weight: 600;
      font-size: 0.8rem; padding: .45rem .8rem; border-radius: 7px; white-space: nowrap;
    }
    nav.tabs button.active { background: var(--card); color: var(--text); border-color: var(--border2); }
    main { max-width: 1000px; margin: 0 auto; padding: 1.3rem 1rem 4rem; }
    h2.title { font-size: 1rem; font-weight: 800; letter-spacing: .04em; margin-bottom: 1rem; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
    h2.title .spacer { flex: 1; }

    .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; margin-bottom: .8rem; }
    .grid { display: grid; gap: 1rem; }
    .muted { color: var(--text2); }
    .row { display: flex; gap: .6rem; align-items: center; flex-wrap: wrap; }
    .between { display: flex; justify-content: space-between; align-items: center; gap: .6rem; flex-wrap: wrap; }

    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th, td { text-align: left; padding: .55rem .5rem; border-bottom: 1px solid var(--border); vertical-align: middle; }
    th { color: var(--text2); font-size: 0.68rem; text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
    tr:last-child td { border-bottom: none; }
    .tbl-wrap { overflow-x: auto; }

    .pill { display: inline-block; padding: .18rem .55rem; border-radius: 20px; font-size: 0.68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; border: 1px solid var(--border2); }
    .pill.on { color: var(--ok); border-color: #143; }
    .pill.off { color: var(--text3); }
    .pill.pendiente { color: var(--warn); border-color: #442; }
    .pill.pagado, .pill.entregado { color: var(--ok); border-color: #143; }
    .pill.enviado { color: var(--info); border-color: #124; }
    .pill.contraentrega { color: var(--info); border-color: #124; }
    .pill.rechazado, .pill.cancelado { color: var(--bad); border-color: #402; }
    .pill.revisar { color: var(--warn); border-color: #442; }
    .banner-rev { border: 1px solid #442; background: #1a1608; border-radius: 12px; padding: .9rem 1rem; margin-bottom: .8rem; }
    .banner-rev strong { color: var(--warn); }

    .thumb { width: 40px; height: 40px; object-fit: cover; border-radius: 6px; background: var(--card2); border: 1px solid var(--border); }
    .stat { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: .8rem; margin-bottom: 1.2rem; }
    .stat .card b { display: block; font-size: 1.6rem; font-weight: 800; }
    .stat .card span { color: var(--text2); font-size: 0.72rem; text-transform: uppercase; letter-spacing: .05em; }
    input.mini { width: 74px; padding: .35rem .45rem; text-align: center; }
    input.days { width: 60px; }
    .imgs { display: flex; gap: .5rem; flex-wrap: wrap; margin-top: .4rem; }
    .imgs .ii { position: relative; }
    .imgs .ii img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border2); }
    .imgs .ii button { position: absolute; top: -6px; right: -6px; width: 18px; height: 18px; border-radius: 50%; border: none; background: var(--bad); color: #000; font-size: 11px; font-weight: 900; line-height: 1; }

    /* ===== PORTADA (hero) ===== */
    .hero-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: .9rem; margin-top: .6rem; }
    .hero-card { position: relative; border: 1px solid var(--border2); border-radius: 12px; overflow: hidden; background: var(--card2); }
    .hero-card img { display: block; width: 100%; aspect-ratio: 16 / 9; object-fit: cover; background: #000; }
    .hero-card .idx { position: absolute; top: .5rem; left: .5rem; background: rgba(0,0,0,.7); color: #fff; font-size: .68rem; font-weight: 700; letter-spacing: .5px; padding: .18rem .5rem; border-radius: 999px; }
    .hero-card .ctrls { display: flex; gap: .35rem; padding: .5rem; }
    .hero-card .ctrls button { flex: 1; min-height: 40px; border: 1px solid var(--border2); border-radius: 8px; background: var(--card); color: var(--text); font-size: 1rem; line-height: 1; cursor: pointer; touch-action: manipulation; }
    .hero-card .ctrls button:disabled { opacity: .35; cursor: default; }
    .hero-card .ctrls .rm { color: var(--bad); border-color: var(--bad); }
    .hero-add { display: flex; align-items: center; justify-content: center; min-height: 132px; border: 1px dashed var(--border2); border-radius: 12px; color: var(--text2); cursor: pointer; font-size: .85rem; text-align: center; padding: 1rem; }
    .hero-add:hover { color: var(--text); border-color: var(--text2); }
    @media (max-width: 560px) { .hero-grid { grid-template-columns: 1fr 1fr; } }
    @media (max-width: 380px) { .hero-grid { grid-template-columns: 1fr; } }

    /* ===== MODAL ===== */
    #modal { position: fixed; inset: 0; z-index: 50; display: none; align-items: flex-start; justify-content: center; background: rgba(0,0,0,.7); padding: 1.5rem 1rem; overflow-y: auto; }
    #modal.show { display: flex; }
    #modal .sheet { width: 100%; max-width: 520px; background: var(--card); border: 1px solid var(--border2); border-radius: 14px; padding: 1.3rem; margin: auto 0; }
    #modal h3 { font-size: 1rem; font-weight: 800; margin-bottom: 1rem; }
    #modal .field { margin-bottom: .9rem; }
    #modal .actions { display: flex; gap: .6rem; justify-content: flex-end; margin-top: 1.2rem; }

    /* ===== TOAST ===== */
    #toast { position: fixed; bottom: 1.2rem; left: 50%; transform: translateX(-50%) translateY(20px); z-index: 90; background: var(--card2); border: 1px solid var(--border2); color: var(--text); padding: .7rem 1.1rem; border-radius: 10px; font-size: 0.83rem; opacity: 0; pointer-events: none; transition: all .25s; max-width: 90vw; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    #toast.bad { border-color: #402; color: var(--bad); }
    #toast.ok { border-color: #143; color: var(--ok); }
    .center-msg { text-align: center; color: var(--text2); padding: 2.5rem 1rem; }
    .spin { display: inline-block; width: 16px; height: 16px; border: 2px solid var(--border2); border-top-color: var(--text); border-radius: 50%; animation: sp .7s linear infinite; vertical-align: -3px; }
    @keyframes sp { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <!-- ===================== LOGIN ===================== -->
  <section id="login">
    <div class="box">
      <img src="assets/images/logo.png" alt="OniYouth">
      <h1>ONIYOUTH · ADMIN</h1>
      <p class="sub">Acceso restringido</p>
      <form id="loginForm">
        <div class="field"><label>Email</label><input type="email" id="li-email" autocomplete="username" required></div>
        <div class="field"><label>Contraseña</label><input type="password" id="li-pass" autocomplete="current-password" required></div>
        <button class="btn" type="submit" id="li-btn">Entrar</button>
      </form>
      <div class="err" id="li-err"></div>
    </div>
  </section>

  <!-- ===================== APP ===================== -->
  <div id="app">
    <header class="bar">
      <img class="logo" src="assets/images/logo.png" alt="">
      <strong style="font-size:.85rem;letter-spacing:.08em">ADMIN</strong>
      <div class="spacer"></div>
      <span class="who" id="whoami"></span>
      <button class="btn ghost sm" id="logout">Salir</button>
    </header>
    <nav class="tabs" id="tabs"></nav>
    <main id="view"></main>
  </div>

  <div id="modal"><div class="sheet" id="sheet"></div></div>
  <div id="toast"></div>

  <script>
  // ============================================================
  // Config Supabase (anon key pública, protegida por RLS). Mismos
  // valores que usa la tienda en index.html.
  // ============================================================
  const SB_URL  = 'https://oblekapcdajpueiteukv.supabase.co';
  const SB_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9ibGVrYXBjZGFqcHVlaXRldWt2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY5MDkxNjAsImV4cCI6MjEwMjQ4NTE2MH0.PN5wYLnftHUhVDct_cggSBnLwsvH7x10GrSY9YMiJvQ';
  const SESS_KEY = 'oni_admin_sess';

  // ---------- estado de sesión ----------
  let sess = null;
  try { sess = JSON.parse(localStorage.getItem(SESS_KEY) || 'null'); } catch (e) { sess = null; }

  function saveSess(data) {
    sess = {
      access_token: data.access_token,
      refresh_token: data.refresh_token,
      expires_at: Date.now() + (Number(data.expires_in || 3600) * 1000),
      email: (data.user && data.user.email) || (sess && sess.email) || ''
    };
    localStorage.setItem(SESS_KEY, JSON.stringify(sess));
  }
  function clearSess() { sess = null; localStorage.removeItem(SESS_KEY); }

  // ---------- auth: login / refresh ----------
  async function login(email, password) {
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { apikey: SB_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, password })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error_description || data.msg || 'Credenciales inválidas');
    saveSess(data);
  }
  async function refresh() {
    if (!sess || !sess.refresh_token) throw new Error('sin sesión');
    const r = await fetch(SB_URL + '/auth/v1/token?grant_type=refresh_token', {
      method: 'POST',
      headers: { apikey: SB_ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: sess.refresh_token })
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error('refresh falló');
    saveSess(data);
  }
  async function freshToken() {
    if (!sess) throw new Error('sin sesión');
    if (Date.now() > sess.expires_at - 60000) await refresh();
    return sess.access_token;
  }

  // ---------- API del panel ----------
  async function api(r, opts = {}) {
    const method = opts.method || 'GET';
    let qs = '?r=' + encodeURIComponent(r);
    if (opts.query) for (const k in opts.query) if (opts.query[k] != null && opts.query[k] !== '') qs += '&' + k + '=' + encodeURIComponent(opts.query[k]);
    async function go() {
      const token = await freshToken();
      const init = { method, headers: { Authorization: 'Bearer ' + token } };
      if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
      return fetch('/api/admin' + qs, init);
    }
    let res = await go();
    if (res.status === 401) { try { await refresh(); res = await go(); } catch (e) { doLogout(); throw new Error('Sesión expirada'); } }
    if (res.status === 403) { toast('Este usuario no tiene acceso de administrador', 'bad'); doLogout(); throw new Error('no autorizado'); }
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.mensaje || data.error || ('Error ' + res.status));
    return data;
  }

  // ---------- subir imagen vía /api (service_role; NO depende de RLS del navegador) ----------
  // El navegador manda el archivo crudo a /api/admin?r=subir-imagen con su
  // Bearer de admin; el servidor valida (requireAdmin) y sube con service_role.
  // Así el permiso ya no depende de que Storage acepte el token del navegador.
  const IMG_MAX_BYTES = 4 * 1024 * 1024;   // 4 MB (el body de una función de Vercel no puede pasar ~4.5 MB)
  const IMG_TIPOS = ['image/jpeg', 'image/png', 'image/webp', 'image/gif', 'image/avif'];
  async function uploadImagen(file) {
    // Validación en el cliente: mensaje claro antes de subir.
    if (file.type && !IMG_TIPOS.includes(file.type)) {
      throw new Error('Formato no permitido (' + (file.type || 'desconocido') + '). Usá JPG, PNG, WebP, GIF o AVIF.');
    }
    if (file.size > IMG_MAX_BYTES) {
      throw new Error('La imagen pesa ' + (file.size / 1048576).toFixed(1) + ' MB; el máximo por subida es 4 MB. Comprimila e intentá de nuevo.');
    }
    const qs = '?r=subir-imagen&nombre=' + encodeURIComponent(file.name) +
               '&tipo=' + encodeURIComponent(file.type || 'application/octet-stream');
    async function go() {
      const token = await freshToken();
      return fetch('/api/admin' + qs, {
        method: 'POST',
        headers: { Authorization: 'Bearer ' + token, 'Content-Type': 'application/octet-stream' },
        body: file
      });
    }
    let r = await go();
    if (r.status === 401) { try { await refresh(); r = await go(); } catch (e) { doLogout(); throw new Error('Sesión expirada'); } }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      throw new Error('No se pudo subir la imagen: ' + (data.mensaje || data.error || ('error ' + r.status)));
    }
    return data.url;
  }

  // ============================================================
  // UI helpers
  // ============================================================
  const $ = (s, el = document) => el.querySelector(s);
  const money = n => 'S/ ' + (Number(n) || 0).toFixed(2);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
  const fmtFecha = s => { try { const d = new Date(s); return d.toLocaleDateString('es-PE', { day:'2-digit', month:'short', year:'numeric' }) + ' ' + d.toLocaleTimeString('es-PE', { hour:'2-digit', minute:'2-digit' }); } catch (e) { return s || ''; } };

  let toastT = null;
  function toast(msg, kind) {
    const t = $('#toast'); t.textContent = msg; t.className = (kind || '') + ' show';
    clearTimeout(toastT); toastT = setTimeout(() => { t.className = t.className.replace('show', '').trim(); }, 2600);
  }
  function openModal(html) { $('#sheet').innerHTML = html; $('#modal').classList.add('show'); }
  function closeModal() { $('#modal').classList.remove('show'); $('#sheet').innerHTML = ''; }
  $('#modal').addEventListener('click', e => { if (e.target.id === 'modal') closeModal(); });
  function loading(el) { el.innerHTML = '<div class="center-msg"><span class="spin"></span> Cargando…</div>'; }

  // ============================================================
  // Router de pestañas
  // ============================================================
  const TABS = [
    { id: 'resumen',  label: 'Resumen',   render: viewResumen },
    { id: 'portada',  label: 'Portada',    render: viewPortada },
    { id: 'productos',label: 'Productos',  render: viewProductos },
    { id: 'stock',    label: 'Stock',      render: viewStock },
    { id: 'guias',    label: 'Guías',      render: viewGuias },
    { id: 'pedidos',  label: 'Pedidos',    render: viewPedidos },
    { id: 'cupones',  label: 'Cupones',    render: viewCupones },
    { id: 'zonas',    label: 'Envíos',     render: viewZonas }
  ];
  let activeTab = 'resumen';
  function renderTabs() {
    $('#tabs').innerHTML = TABS.map(t => '<button data-tab="' + t.id + '" class="' + (t.id === activeTab ? 'active' : '') + '">' + t.label + '</button>').join('');
    $('#tabs').querySelectorAll('button').forEach(b => b.onclick = () => go(b.dataset.tab));
  }
  function go(tab) { activeTab = tab; renderTabs(); const t = TABS.find(x => x.id === tab); if (t) t.render($('#view')); }

  // ============================================================
  // VISTA: RESUMEN
  // ============================================================
  async function viewResumen(el) {
    loading(el);
    try {
      const d = await api('resumen');
      const top = Array.isArray(d.top_productos) ? d.top_productos : [];
      el.innerHTML =
        '<h2 class="title">Resumen del mes</h2>' +
        '<div class="stat">' +
          '<div class="card"><b>' + money(d.ventas_mes) + '</b><span>Ventas del mes</span></div>' +
          '<div class="card"><b>' + (d.num_pedidos_mes || 0) + '</b><span>Pedidos cobrados</span></div>' +
        '</div>' +
        '<h2 class="title">Productos más vendidos</h2>' +
        '<div class="card">' +
          (top.length ? '<div class="tbl-wrap"><table><thead><tr><th>Producto</th><th style="text-align:right">Unidades</th></tr></thead><tbody>' +
            top.map(p => '<tr><td>' + esc(p.nombre) + '</td><td style="text-align:right"><strong>' + (p.unidades || 0) + '</strong></td></tr>').join('') +
            '</tbody></table></div>'
          : '<p class="muted">Aún no hay ventas registradas.</p>') +
        '</div>' +
        '<h2 class="title">Correo de prueba</h2>' +
        '<div class="card">' +
          '<p class="muted" style="font-size:.82rem;margin-bottom:.8rem">Envía un ejemplo (cliente + admin) para revisar el diseño en tu bandeja. Requiere el dominio verificado en Resend.</p>' +
          '<div class="row">' +
            '<input id="testTo" type="email" placeholder="correo destino (vacío = tu correo admin)" style="flex:1;min-width:200px">' +
            '<button class="btn sm" id="testBtn">Enviar prueba</button>' +
          '</div>' +
        '</div>';
      $('#testBtn').onclick = async () => {
        const to = $('#testTo').value.trim();
        const btn = $('#testBtn'), orig = btn.textContent;
        btn.disabled = true; btn.textContent = 'Enviando…';
        try { const r = await api('test-email', { method: 'POST', body: to ? { to } : {} }); toast('Correo de prueba enviado a ' + (r.enviado_a || 'tu correo'), 'ok'); }
        catch (e) { toast(e.message, 'bad'); }
        btn.disabled = false; btn.textContent = orig;
      };
    } catch (e) { el.innerHTML = '<div class="center-msg">' + esc(e.message) + '</div>'; }
  }

  // ============================================================
  // VISTA: PORTADA (imágenes del hero de la página principal)
  //
  // Lee/guarda la clave 'hero_slides' (array de URLs) vía /api/admin?r=config.
  // Reordenar, quitar y subir imágenes; se guarda todo junto al presionar
  // "Guardar cambios". El front (index.html) lee esta misma lista al cargar.
  // ============================================================
  async function viewPortada(el) {
    loading(el);
    let slides = [];
    try {
      const d = await api('config', { query: { clave: 'hero_slides' } });
      slides = Array.isArray(d.valor) ? d.valor.slice() : [];
    } catch (e) { el.innerHTML = '<div class="center-msg">' + esc(e.message) + '</div>'; return; }

    function draw() {
      const cards = slides.map((u, i) =>
        '<div class="hero-card">' +
          '<span class="idx">' + (i + 1) + '</span>' +
          '<img src="' + esc(u) + '" alt="">' +
          '<div class="ctrls">' +
            '<button type="button" data-up="' + i + '" title="Subir en el orden"' + (i === 0 ? ' disabled' : '') + '>↑</button>' +
            '<button type="button" data-down="' + i + '" title="Bajar en el orden"' + (i === slides.length - 1 ? ' disabled' : '') + '>↓</button>' +
            '<button type="button" class="rm" data-rm="' + i + '" title="Quitar">×</button>' +
          '</div>' +
        '</div>'
      ).join('');
      const add = '<label class="hero-add">+ Agregar imagen<input type="file" accept="image/*" id="heroFile" hidden></label>';
      el.innerHTML =
        '<h2 class="title">Portada <span class="spacer"></span><button class="btn" id="heroSave">Guardar cambios</button></h2>' +
        '<div class="card">' +
          '<p class="muted" style="font-size:.82rem;margin-bottom:.2rem">Estas imágenes se muestran en rotación en la parte superior de la página principal. Se adaptan solas a cualquier pantalla (celular, tablet o computadora); usá fotos horizontales de buena calidad. Máx. 4 MB, hasta 12 imágenes.</p>' +
          (slides.length ? '' : '<p class="muted" style="font-size:.82rem;margin:.6rem 0">Todavía no hay imágenes. Agregá al menos una.</p>') +
          '<div class="hero-grid">' + cards + add + '</div>' +
        '</div>';
      bind();
    }

    function bind() {
      el.querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { slides.splice(+b.dataset.rm, 1); draw(); });
      el.querySelectorAll('[data-up]').forEach(b => b.onclick = () => { const i = +b.dataset.up; if (i > 0) { [slides[i - 1], slides[i]] = [slides[i], slides[i - 1]]; draw(); } });
      el.querySelectorAll('[data-down]').forEach(b => b.onclick = () => { const i = +b.dataset.down; if (i < slides.length - 1) { [slides[i + 1], slides[i]] = [slides[i], slides[i + 1]]; draw(); } });
      const fi = $('#heroFile');
      if (fi) fi.onchange = async () => {
        const file = fi.files[0]; if (!file) return;
        if (slides.length >= 12) { toast('Máximo 12 imágenes', 'bad'); return; }
        toast('Subiendo imagen…');
        try { const url = await uploadImagen(file); slides.push(url); draw(); toast('Imagen subida — acordate de Guardar', 'ok'); }
        catch (e) { toast(e.message, 'bad'); }
      };
      $('#heroSave').onclick = async () => {
        if (!slides.length) { toast('Dejá al menos una imagen', 'bad'); return; }
        const btn = $('#heroSave'), orig = btn.textContent;
        btn.disabled = true; btn.textContent = 'Guardando…';
        try { await api('config', { method: 'POST', body: { clave: 'hero_slides', valor: slides } }); toast('Portada actualizada', 'ok'); }
        catch (e) { toast(e.message, 'bad'); }
        btn.disabled = false; btn.textContent = orig;
      };
    }

    draw();
  }

  // ============================================================
  // VISTA: PRODUCTOS
  // ============================================================
  let productosCache = [];
  async function viewProductos(el) {
    loading(el);
    try {
      productosCache = await api('productos');
      el.innerHTML =
        '<h2 class="title">Productos <span class="spacer"></span><button class="btn sm" id="nuevoProd">+ Nuevo</button></h2>' +
        '<div class="tbl-wrap card"><table><thead><tr><th></th><th>Nombre</th><th>Precio</th><th>Categoría</th><th>Estado</th><th></th></tr></thead><tbody>' +
        productosCache.map(p => {
          const img = (p.imagenes && p.imagenes[0]) || '';
          return '<tr>' +
            '<td>' + (img ? '<img class="thumb" src="' + esc(img) + '" alt="">' : '<div class="thumb"></div>') + '</td>' +
            '<td><strong>' + esc(p.nombre) + '</strong></td>' +
            '<td>' + money(p.precio) + '</td>' +
            '<td class="muted">' + esc(p.categoria || '—') + '</td>' +
            '<td><span class="pill ' + (p.activo ? 'on' : 'off') + '">' + (p.activo ? 'Activo' : 'Oculto') + '</span></td>' +

            '</td></tr>';
        }).join('') +
        '</tbody></table></div>';
      $('#nuevoProd').onclick = () => formProducto(null);
      el.querySelectorAll('[data-edit]').forEach(b => b.onclick = () => formProducto(productosCache.find(p => p.id === b.dataset.edit)));
      el.querySelectorAll('[data-colores]').forEach(b => b.onclick = () => formColores(productosCache.find(p => p.id === b.dataset.colores)));
      el.querySelectorAll('[data-toggle]').forEach(b => b.onclick = async () => {
        const p = productosCache.find(x => x.id === b.dataset.toggle);
        b.disabled = true;
        try { await api('productos', { method: 'PATCH', body: { id: p.id, activo: !p.activo } }); toast('Actualizado', 'ok'); viewProductos(el); }
        catch (e) { toast(e.message, 'bad'); b.disabled = false; }
      });
    } catch (e) { el.innerHTML = '<div class="center-msg">' + esc(e.message) + '</div>'; }
  }

  function formProducto(p) {
    const nuevo = !p;
    let imgs = p && Array.isArray(p.imagenes) ? p.imagenes.slice() : [];
    function imgsHtml() {
      return imgs.map((u, i) => '<div class="ii"><img src="' + esc(u) + '"><button type="button" data-rm="' + i + '">×</button></div>').join('') +
        '<label class="btn ghost sm" style="display:inline-flex;align-items:center;margin:0;cursor:pointer">+ Imagen<input type="file" accept="image/*" id="imgFile" style="display:none"></label>';
    }
    openModal(
      '<h3>' + (nuevo ? 'Nuevo producto' : 'Editar producto') + '</h3>' +
      '<div class="field"><label>Nombre</label><input id="f-nombre" value="' + esc(p ? p.nombre : '') + '"></div>' +
      '<div class="field"><label>Descripción</label><textarea id="f-desc">' + esc(p ? (p.descripcion || '') : '') + '</textarea></div>' +
      '<div class="row"><div class="field" style="flex:1"><label>Precio (S/)</label><input id="f-precio" type="number" step="0.01" value="' + (p ? p.precio : '') + '"></div>' +
      '<div class="field" style="flex:1"><label>Categoría</label><input id="f-cat" value="' + esc(p ? (p.categoria || '') : '') + '"></div>' +
      '<div class="field" style="width:90px"><label>Orden</label><input id="f-orden" type="number" value="' + (p ? (p.orden || 0) : 0) + '"></div></div>' +
      '<div class="field"><label>Imágenes</label><div class="imgs" id="imgsBox">' + imgsHtml() + '</div></div>' +
      '<div class="actions"><button class="btn ghost" id="f-cancel">Cancelar</button><button class="btn" id="f-save">Guardar</button></div>'
    );
    function bind() {
      $('#imgsBox').querySelectorAll('[data-rm]').forEach(b => b.onclick = () => { imgs.splice(+b.dataset.rm, 1); $('#imgsBox').innerHTML = imgsHtml(); bind(); });
      const fi = $('#imgFile');
      if (fi) fi.onchange = async () => {
        const file = fi.files[0]; if (!file) return;
        toast('Subiendo imagen…');
        try { const url = await uploadImagen(file); imgs.push(url); $('#imgsBox').innerHTML = imgsHtml(); bind(); toast('Imagen subida', 'ok'); }
        catch (e) { toast(e.message, 'bad'); }
      };
    }
    bind();
    $('#f-cancel').onclick = closeModal;
    $('#f-save').onclick = async () => {
      const body = {
        nombre: $('#f-nombre').value.trim(),
        descripcion: $('#f-desc').value,
        precio: $('#f-precio').value,
        categoria: $('#f-cat').value.trim(),
        orden: $('#f-orden').value,
        imagenes: imgs
      };
      if (!body.nombre) return toast('Falta el nombre', 'bad');
      $('#f-save').disabled = true;
      try {
        if (nuevo) await api('productos', { method: 'POST', body });
        else await api('productos', { method: 'PATCH', body: Object.assign({ id: p.id }, body) });
        toast('Guardado', 'ok'); closeModal(); viewProductos($('#view'));
      } catch (e) { toast(e.message, 'bad'); $('#f-save').disabled = false; }
    };
  }

  // ============================================================
  // COLORES de un producto (galería + stock por talla, por color)
  // ============================================================
  async function formColores(p) {
    if (!p) return;
    openModal('<h3>Colores · ' + esc(p.nombre) + '</h3><div id="coloresBox"><div class="center-msg"><span class="spin"></span> Cargando…</div></div>' +
      '<div class="actions"><button class="btn ghost" id="c-cerrar">Cerrar</button><button class="btn" id="c-nuevo">+ Nuevo color</button></div>');
    $('#c-cerrar').onclick = closeModal;
    $('#c-nuevo').onclick = () => formColor(p, null);
    async function pinta() {
      try {
        const cols = await api('colores', { query: { producto_id: p.id } });
        const box = $('#coloresBox');
        if (!cols.length) { box.innerHTML = '<div class="muted" style="padding:.5rem 0">Sin colores. Creá el primero.</div>'; return; }
        box.innerHTML = cols.map(c => {
          const img = (c.imagenes && c.imagenes[0]) || '';
          const nStock = (c.variantes || []).reduce((s, v) => s + (v.stock || 0), 0);
          return '<div class="between card" style="background:var(--card2);margin-bottom:.5rem">' +
            '<div class="row" style="align-items:center;gap:.6rem">' +
              (img ? '<img class="thumb" src="' + esc(img) + '" alt="">' : '<div class="thumb"></div>') +
              '<div><strong>' + esc(c.nombre) + '</strong><div class="muted" style="font-size:.72rem">' +
                (c.imagenes ? c.imagenes.length : 0) + ' foto(s) · ' + nStock + ' en stock</div></div>' +
            '</div>' +
            '<div class="row">' +
              '<button class="btn ghost sm" data-cedit="' + c.id + '">Editar</button>' +
              '<button class="btn ghost sm" data-cdel="' + c.id + '">Borrar</button>' +
            '</div></div>';
        }).join('');
        box.querySelectorAll('[data-cedit]').forEach(b => b.onclick = () => formColor(p, cols.find(c => c.id === b.dataset.cedit)));
        box.querySelectorAll('[data-cdel]').forEach(b => b.onclick = async () => {
          const c = cols.find(x => x.id === b.dataset.cdel);
          if (!confirm('Borrar el color "' + c.nombre + '"? Se elimina también su stock por talla. (No borra ventas ya hechas.)')) return;
          b.disabled = true;
          try { await api('colores', { method: 'DELETE', query: { id: c.id } }); toast('Color borrado', 'ok'); pinta(); }
          catch (e) { toast(e.message, 'bad'); b.disabled = false; }
        });
      } catch (e) { $('#coloresBox').innerHTML = '<div class="center-msg">' + esc(e.message) + '</div>'; }
    }
    // Exponer para refrescar desde formColor.
    formColores._refresh = pinta;
    pinta();
  }

  function formColor(p, c) {
    const nuevo = !c;
    let imgs = c && Array.isArray(c.imagenes) ? c.imagenes.slice() : [];
    function imgsHtml() {
      return imgs.map((u, i) => '<div class="ii"><img src="' + esc(u) + '"><button type="button" data-rm="' + i + '">×</button></div>').join('') +
        '<label class="btn ghost sm" style="display:inline-flex;align-items:center;margin:0;cursor:pointer">+ Foto<input type="file" accept="image/*" id="cImgFile" style="display:none"></label>';
    }
    openModal(
      '<h3>' + (nuevo ? 'Nuevo color' : 'Editar color') + ' · ' + esc(p.nombre) + '</h3>' +
      '<div class="field"><label>Nombre del color</label><input id="fc-nombre" placeholder="Ej: Negro" value="' + esc(c ? c.nombre : '') + '"></div>' +
      '<div class="field"><label>Fotos del color <span class="muted">(la 1ª es la miniatura del selector)</span></label><div class="imgs" id="cImgsBox">' + imgsHtml() + '</div></div>' +
      (nuevo ? '<div class="muted" style="font-size:.75rem;margin-bottom:.5rem">Se crean las tallas XS–XL con stock 0; el stock se ajusta en la pestaña Stock.</div>' : '') +

      const fi = $('#cImgFile');
      if (fi) fi.onchange = async () => {
        const file = fi.files[0]; if (!file) return;
        toast('Subiendo foto…');
        try { const url = await uploadImagen(file); imgs.push(url); $('#cImgsBox').innerHTML = imgsHtml(); bind(); toast('Foto subida', 'ok'); }
        catch (e) { toast(e.message, 'bad'); }
      };

        toast('Color guardado', 'ok'); formColores(p);

  // ============================================================
  // VISTA: STOCK (edición rápida por color y talla)
  // ============================================================
  const SIZE_ORDER_ADMIN = ['XS', 'S', 'M', 'L', 'XL', 'XXL'];
  function sizeRankAdmin(t) { const i = SIZE_ORDER_ADMIN.indexOf(String(t || '').toUpperCase()); return i < 0 ? 99 : i; }

  async function viewStock(el) {
    loading(el);
    try {
      const prods = await api('productos');
      el.innerHTML = '<h2 class="title">Stock por color y talla</h2>' +
        prods.map(p => {
          const vars = p.variantes || [];
          // Agrupa por color usando la lista de colores del producto; añade un
          // grupo "Sin color" defensivo por si quedara alguna variante suelta.
          const colores = (p.colores || []).slice().sort((a, b) => (a.orden || 0) - (b.orden || 0));
          const grupos = colores.map(c => ({
            id: c.id, nombre: c.nombre,
            vs: vars.filter(v => v.color_id === c.id).sort((a, b) => sizeRankAdmin(a.talla) - sizeRankAdmin(b.talla))
          }));
          const sueltas = vars.filter(v => !v.color_id);
          if (sueltas.length) grupos.push({ id: '_none', nombre: 'Sin color', vs: sueltas.sort((a, b) => sizeRankAdmin(a.talla) - sizeRankAdmin(b.talla)) });

          const cuerpo = grupos.length ? grupos.map(g =>
            '<div style="margin-top:.6rem"><div class="muted" style="font-size:.75rem;letter-spacing:1px;text-transform:uppercase;margin-bottom:.3rem">' + esc(g.nombre || 'Color') + '</div>' +
            '<div class="row">' +
            (g.vs.length ? g.vs.map(v => '<div style="text-align:center"><label style="text-align:center">' + esc(v.talla) + '</label>' +
              '<input class="mini" type="number" min="0" value="' + (v.stock || 0) + '" data-vid="' + v.id + '"></div>').join('')
              : '<span class="muted">Sin tallas</span>') +
            '</div></div>').join('') : '<span class="muted">Sin colores</span>';

          return '<div class="card" data-prod="' + p.id + '"><div class="between" style="margin-bottom:.4rem"><strong>' + esc(p.nombre) + '</strong>' +
            '<button class="btn sm" data-save="' + p.id + '">Guardar</button></div>' + cuerpo + '</div>';
        }).join('');
      el.querySelectorAll('[data-save]').forEach(btn => btn.onclick = async () => {
        const box = el.querySelector('[data-prod="' + btn.dataset.save + '"]');
        const cambios = Array.from(box.querySelectorAll('input[data-vid]')).map(i => ({ id: i.dataset.vid, stock: i.value }));
        btn.disabled = true;
        try { await api('variantes', { method: 'PATCH', body: { cambios } }); toast('Stock guardado', 'ok'); }
        catch (e) { toast(e.message, 'bad'); }
        btn.disabled = false;
      });
    } catch (e) { el.innerHTML = '<div class="center-msg">' + esc(e.message) + '</div>'; }
  }

  // ============================================================
  // VISTA: GUÍAS DE TALLA (imagen por producto o por categoría)
  // ============================================================
  async function viewGuias(el) {
    loading(el);
    try {
      const [guias, prods] = await Promise.all([api('guias'), api('productos')]);
      const prodById = {}; prods.forEach(p => prodById[p.id] = p);
      const cats = []; prods.forEach(p => { if (p.categoria && cats.indexOf(p.categoria) === -1) cats.push(p.categoria); });

      const lista = guias.length ? guias.map(g => {
        const destino = g.producto_id
          ? ('Producto: ' + esc((prodById[g.producto_id] || {}).nombre || g.producto_id))
          : ('Categoría: ' + esc(g.categoria || '—'));
        return '<div class="between card" style="background:var(--card2);margin-bottom:.5rem">' +
          '<div class="row" style="align-items:center;gap:.6rem">' +
            '<img class="thumb" src="' + esc(g.imagen_url) + '" alt="">' +
            '<div><strong>' + destino + '</strong></div>' +
          '</div>' +
          '<button class="btn ghost sm" data-gdel="' + g.id + '">Borrar</button></div>';
      }).join('') : '<div class="muted" style="padding:.5rem 0">Todavía no hay guías.</div>';

      el.innerHTML = '<h2 class="title">Guías de tallas</h2>' +
        '<div class="card"><strong>Subir / actualizar guía</strong>' +
        '<div class="field" style="margin-top:.6rem"><label>Aplicar a</label>' +
          '<select id="g-ambito"><option value="producto">Un producto</option><option value="categoria">Una categoría</option></select></div>' +
        '<div class="field" id="g-prod-wrap"><label>Producto</label><select id="g-prod">' +
          prods.map(p => '<option value="' + p.id + '">' + esc(p.nombre) + '</option>').join('') + '</select></div>' +
        '<div class="field" id="g-cat-wrap" style="display:none"><label>Categoría</label>' +
          (cats.length ? '<select id="g-cat">' + cats.map(c => '<option value="' + esc(c) + '">' + esc(c) + '</option>').join('') + '</select>'
                       : '<input id="g-cat" placeholder="Nombre de categoría">') + '</div>' +
        '<div class="field"><label>Imagen de la guía</label><div class="imgs" id="gImgBox">' +
          '<label class="btn ghost sm" style="display:inline-flex;align-items:center;margin:0;cursor:pointer">+ Imagen<input type="file" accept="image/*" id="gImgFile" style="display:none"></label></div></div>' +
        '<div class="actions"><button class="btn" id="g-save" disabled>Guardar guía</button></div></div>' +
        '<h2 class="title" style="margin-top:1rem">Guías actuales</h2>' + lista;

      let imgUrl = '';
      const amb = $('#g-ambito');
      amb.onchange = () => {
        $('#g-prod-wrap').style.display = amb.value === 'producto' ? '' : 'none';
        $('#g-cat-wrap').style.display = amb.value === 'categoria' ? '' : 'none';
      };
      $('#gImgFile').onchange = async () => {
        const file = $('#gImgFile').files[0]; if (!file) return;
        toast('Subiendo imagen…');
        try {
          imgUrl = await uploadImagen(file);
          $('#gImgBox').innerHTML = '<div class="ii"><img src="' + esc(imgUrl) + '"></div>' + $('#gImgBox').innerHTML;
          $('#g-save').disabled = false; toast('Imagen lista', 'ok');
        } catch (e) { toast(e.message, 'bad'); }
      };
      $('#g-save').onclick = async () => {
        if (!imgUrl) return toast('Subí la imagen primero', 'bad');
        const body = { imagen_url: imgUrl };
        if (amb.value === 'producto') body.producto_id = $('#g-prod').value;
        else { const cv = $('#g-cat').value; if (!cv) return toast('Elegí o escribí la categoría', 'bad'); body.categoria = cv; }
        $('#g-save').disabled = true;
        try { await api('guias', { method: 'POST', body }); toast('Guía guardada', 'ok'); viewGuias(el); }
        catch (e) { toast(e.message, 'bad'); $('#g-save').disabled = false; }
      };
      el.querySelectorAll('[data-gdel]').forEach(b => b.onclick = async () => {
        if (!confirm('¿Borrar esta guía?')) return;
        b.disabled = true;
        try { await api('guias', { method: 'DELETE', query: { id: b.dataset.gdel } }); toast('Guía borrada', 'ok'); viewGuias(el); }
        catch (e) { toast(e.message, 'bad'); b.disabled = false; }
      });
    } catch (e) { el.innerHTML = '<div class="center-msg">' + esc(e.message) + '</div>'; }
  }

  // ============================================================
  // VISTA: PEDIDOS
  // ============================================================
  const ESTADOS = ['pendiente', 'pagado', 'contraentrega', 'enviado', 'entregado', 'rechazado', 'cancelado'];
  let filtroEstado = '';
  let soloRevisar = false;
  async function viewPedidos(el) {
    loading(el);
    try {
      let pedidos = await api('pedidos', { query: filtroEstado ? { estado: filtroEstado } : {} });
      if (soloRevisar) pedidos = pedidos.filter(p => p.requiere_revision);
      const opts = '<option value="">Todos</option>' + ESTADOS.map(e => '<option value="' + e + '"' + (e === filtroEstado ? ' selected' : '') + '>' + e + '</option>').join('');
      el.innerHTML = '<h2 class="title">Pedidos <span class="spacer"></span>' +
          '<label style="display:flex;align-items:center;gap:.35rem;font-size:.72rem;text-transform:none;letter-spacing:0;color:var(--warn);margin:0;cursor:pointer">' +
            '<input type="checkbox" id="fRev" style="width:auto"' + (soloRevisar ? ' checked' : '') + '> ⚠ Solo revisar</label>' +
          '<select id="fEstado" style="width:auto">' + opts + '</select></h2>' +
        (pedidos.length ? '<div class="tbl-wrap card"><table><thead><tr><th>Código</th><th>Fecha</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody>' +
          pedidos.map(p => '<tr style="cursor:pointer" data-cod="' + p.codigo + '">' +
            '<td><strong>' + esc(p.codigo) + '</strong></td>' +
            '<td class="muted">' + fmtFecha(p.creado_en) + '</td>' +
            '<td>' + esc(p.cliente_nombre || '—') + '</td>' +
            '<td>' + money(p.total) + '</td>' +
            '<td><span class="pill ' + esc(p.estado) + '">' + esc(p.estado) + '</span>' +
              (p.requiere_revision ? ' <span class="pill revisar">⚠ Revisar</span>' : '') + '</td></tr>').join('') +
          '</tbody></table></div>'
          : '<div class="card"><p class="muted">No hay pedidos' + (soloRevisar ? ' por revisar' : (filtroEstado ? ' en ese estado' : '')) + '.</p></div>');
      $('#fEstado').onchange = e => { filtroEstado = e.target.value; viewPedidos(el); };
      $('#fRev').onchange = e => { soloRevisar = e.target.checked; viewPedidos(el); };
      el.querySelectorAll('[data-cod]').forEach(tr => tr.onclick = () => detallePedido(tr.dataset.cod));
    } catch (e) { el.innerHTML = '<div class="center-msg">' + esc(e.message) + '</div>'; }
  }

  async function detallePedido(codigo) {
    openModal('<div class="center-msg"><span class="spin"></span></div>');
    try {
      const p = await api('pedidos', { query: { codigo } });
      const items = Array.isArray(p.items) ? p.items : [];
      const opts = ESTADOS.map(e => '<option value="' + e + '"' + (e === p.estado ? ' selected' : '') + '>' + e + '</option>').join('');
      openModal(
        '<h3>' + esc(p.codigo) + ' <span class="pill ' + esc(p.estado) + '">' + esc(p.estado) + '</span></h3>' +
        (p.requiere_revision ? '<div class="banner-rev"><strong>⚠ Requiere revisión</strong>' +
          '<div class="muted" style="margin-top:.35rem;font-size:.82rem">' + esc(p.revision_motivo || 'Marcado para revisión.') + '</div>' +
          '<button class="btn sm" id="pe-revisado" style="margin-top:.7rem">Marcar como revisado</button></div>' : '') +
        '<div class="card" style="background:var(--card2)"><div class="tbl-wrap"><table><tbody>' +
          items.map(it => '<tr><td>' + esc(it.nombre) + ' · <span class="muted">T. ' + esc(it.talla) + '</span></td><td class="muted">x' + (it.qty || 0) + '</td><td style="text-align:right">' + money(it.subtotal) + '</td></tr>').join('') +
          '<tr><td colspan="2" class="muted">Subtotal</td><td style="text-align:right">' + money(p.subtotal) + '</td></tr>' +
          '<tr><td colspan="2" class="muted">Envío</td><td style="text-align:right">' + money(p.envio) + '</td></tr>' +
          (p.descuento > 0 ? '<tr><td colspan="2" class="muted">Descuento</td><td style="text-align:right">-' + money(p.descuento) + '</td></tr>' : '') +
          '<tr><td colspan="2"><strong>Total</strong></td><td style="text-align:right"><strong>' + money(p.total) + '</strong></td></tr>' +
        '</tbody></table></div></div>' +
        '<div class="card" style="background:var(--card2)"><div style="font-size:.83rem;line-height:1.7">' +
          '<div><span class="muted">Cliente:</span> ' + esc(p.cliente_nombre || '—') + '</div>' +
          '<div><span class="muted">Teléfono:</span> ' + esc(p.cliente_telefono || '—') + '</div>' +
          '<div><span class="muted">Email:</span> ' + esc(p.cliente_email || '—') + '</div>' +
          '<div><span class="muted">Zona:</span> ' + esc(p.distrito || '—') + '</div>' +
          '<div><span class="muted">Dirección:</span> ' + esc(p.direccion || '—') + '</div>' +
          (p.payment_id ? '<div><span class="muted">Pago MP:</span> ' + esc(p.payment_id) + '</div>' : '') +
        '</div></div>' +
        '<div class="field"><label>Cambiar estado</label><select id="pe-estado">' + opts + '</select></div>' +
        '<div class="actions"><button class="btn ghost" id="pe-cancel">Cerrar</button><button class="btn" id="pe-save">Guardar estado</button></div>'
      );
      $('#pe-cancel').onclick = closeModal;
      if (p.requiere_revision) $('#pe-revisado').onclick = async () => {
        $('#pe-revisado').disabled = true;
        try { await api('pedidos', { method: 'PATCH', body: { codigo: p.codigo, requiere_revision: false } }); toast('Marcado como revisado', 'ok'); closeModal(); viewPedidos($('#view')); }
        catch (e) { toast(e.message, 'bad'); $('#pe-revisado').disabled = false; }
      };
      $('#pe-save').onclick = async () => {
        const estado = $('#pe-estado').value;
        $('#pe-save').disabled = true;
        try { await api('pedidos', { method: 'PATCH', body: { codigo: p.codigo, estado } }); toast('Estado actualizado', 'ok'); closeModal(); viewPedidos($('#view')); }
        catch (e) { toast(e.message, 'bad'); $('#pe-save').disabled = false; }
      };
    } catch (e) { closeModal(); toast(e.message, 'bad'); }
  }

  // ============================================================
  // VISTA: CUPONES
  // ============================================================
  async function viewCupones(el) {
    loading(el);
    try {
      const cupones = await api('cupones');
      el.innerHTML = '<h2 class="title">Cupones <span class="spacer"></span><button class="btn sm" id="nuevoCup">+ Nuevo</button></h2>' +
        '<div class="tbl-wrap card"><table><thead><tr><th>Código</th><th>Tipo</th><th>Valor</th><th>Usos</th><th>Vence</th><th>Estado</th><th></th></tr></thead><tbody>' +
        (cupones.length ? cupones.map(c => '<tr>' +
          '<td><strong>' + esc(c.codigo) + '</strong></td>' +
          '<td class="muted">' + esc(c.tipo) + '</td>' +
          '<td>' + (c.tipo === 'porcentaje' ? (c.valor + '%') : money(c.valor)) + '</td>' +
          '<td class="muted">' + (c.usos || 0) + (c.usos_max != null ? ' / ' + c.usos_max : '') + '</td>' +
          '<td class="muted">' + (c.vence_en ? fmtFecha(c.vence_en) : '—') + '</td>' +
          '<td><span class="pill ' + (c.activo ? 'on' : 'off') + '">' + (c.activo ? 'Activo' : 'Inactivo') + '</span></td>' +
          '<td style="text-align:right"><button class="btn ghost sm" data-tog="' + c.id + '">' + (c.activo ? 'Desactivar' : 'Activar') + '</button></td></tr>').join('')
          : '<tr><td colspan="7" class="muted">No hay cupones.</td></tr>') +
        '</tbody></table></div>';
      $('#nuevoCup').onclick = formCupon;
      el.querySelectorAll('[data-tog]').forEach(b => b.onclick = async () => {
        const c = cupones.find(x => x.id === b.dataset.tog); b.disabled = true;
        try { await api('cupones', { method: 'PATCH', body: { id: c.id, activo: !c.activo } }); toast('Actualizado', 'ok'); viewCupones(el); }
        catch (e) { toast(e.message, 'bad'); b.disabled = false; }
      });
    } catch (e) { el.innerHTML = '<div class="center-msg">' + esc(e.message) + '</div>'; }
  }

  function formCupon() {
    openModal(
      '<h3>Nuevo cupón</h3>' +
      '<div class="field"><label>Código</label><input id="c-cod" placeholder="EJ: ONI10"></div>' +
      '<div class="row"><div class="field" style="flex:1"><label>Tipo</label><select id="c-tipo"><option value="porcentaje">Porcentaje (%)</option><option value="fijo">Monto fijo (S/)</option></select></div>' +
      '<div class="field" style="flex:1"><label>Valor</label><input id="c-valor" type="number" step="0.01"></div></div>' +
      '<div class="row"><div class="field" style="flex:1"><label>Usos máx (opcional)</label><input id="c-usos" type="number" placeholder="ilimitado"></div>' +
      '<div class="field" style="flex:1"><label>Vence (opcional)</label><input id="c-vence" type="date"></div></div>' +
      '<div class="actions"><button class="btn ghost" id="c-cancel">Cancelar</button><button class="btn" id="c-save">Crear</button></div>'
    );
    $('#c-cancel').onclick = closeModal;
    $('#c-save').onclick = async () => {
      const body = {
        codigo: $('#c-cod').value.trim(),
        tipo: $('#c-tipo').value,
        valor: $('#c-valor').value,
        usos_max: $('#c-usos').value || null,
        vence_en: $('#c-vence').value ? new Date($('#c-vence').value + 'T23:59:59').toISOString() : null
      };
      if (!body.codigo) return toast('Falta el código', 'bad');
      $('#c-save').disabled = true;
      try { await api('cupones', { method: 'POST', body }); toast('Cupón creado', 'ok'); closeModal(); viewCupones($('#view')); }
      catch (e) { toast(e.message, 'bad'); $('#c-save').disabled = false; }
    };
  }

  // ============================================================
  // VISTA: ZONAS DE ENVÍO
  // ============================================================
  async function viewZonas(el) {
    loading(el);
    try {
      const zonas = await api('zonas');
      el.innerHTML = '<h2 class="title">Zonas de envío</h2>' +
        '<div class="tbl-wrap card"><table><thead><tr><th>Zona</th><th>Costo</th><th>Días</th><th>Contraentrega</th><th></th></tr></thead><tbody>' +
        zonas.map(z => '<tr data-zona="' + z.id + '">' +
          '<td><strong>' + esc(z.nombre) + '</strong></td>' +
          '<td><input class="mini" type="number" step="0.01" min="0" data-f="costo_envio" value="' + (z.costo_envio || 0) + '"></td>' +
          '<td><input class="mini days" type="number" min="0" data-f="dias_estimados" value="' + (z.dias_estimados || 0) + '"></td>' +
          '<td><input type="checkbox" data-f="contraentrega" style="width:auto"' + (z.contraentrega ? ' checked' : '') + '></td>' +
          '<td style="text-align:right"><button class="btn sm" data-savez="' + z.id + '">Guardar</button></td></tr>').join('') +
        '</tbody></table></div>';
      el.querySelectorAll('[data-savez]').forEach(btn => btn.onclick = async () => {
        const tr = el.querySelector('[data-zona="' + btn.dataset.savez + '"]');
        const body = { id: btn.dataset.savez };
        tr.querySelectorAll('[data-f]').forEach(i => body[i.dataset.f] = i.type === 'checkbox' ? i.checked : i.value);
        btn.disabled = true;
        try { await api('zonas', { method: 'PATCH', body }); toast('Zona guardada', 'ok'); }
        catch (e) { toast(e.message, 'bad'); }
        btn.disabled = false;
      });
    } catch (e) { el.innerHTML = '<div class="center-msg">' + esc(e.message) + '</div>'; }
  }

  // ============================================================
  // Arranque / sesión
  // ============================================================
  function showApp() {
    $('#login').style.display = 'none';
    $('#app').style.display = 'block';
    $('#whoami').textContent = (sess && sess.email) || '';
    renderTabs(); go('resumen');
  }
  function showLogin() { $('#app').style.display = 'none'; $('#login').style.display = 'flex'; }
  function doLogout() { clearSess(); showLogin(); }

  $('#logout').onclick = doLogout;
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    $('#li-err').textContent = ''; $('#li-btn').disabled = true; $('#li-btn').textContent = 'Entrando…';
    try { await login($('#li-email').value.trim(), $('#li-pass').value); showApp(); }
    catch (err) { $('#li-err').textContent = err.message; }
    $('#li-btn').disabled = false; $('#li-btn').textContent = 'Entrar';
  };

  // Si hay sesión guardada, intenta refrescarla y entrar; si no, login.
  (async function boot() {
    if (sess && sess.refresh_token) {
      try { await refresh(); showApp(); return; } catch (e) { clearSess(); }
    }
    showLogin();
  })();
  </script>
</body>
</html>
